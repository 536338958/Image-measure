  }
  function exportPdf(){
    const{jsPDF}=window.jspdf;const pdf=new jsPDF({orientation:"portrait",unit:"mm",format:"a4"});const pw=210,ph=297,mg=14;
    pdf.setFont("helvetica","bold");pdf.setFontSize(16);pdf.setTextColor(30);pdf.text("Measurement Report",mg,18);
    pdf.setFont("helvetica","normal");pdf.setFontSize(9);pdf.setTextColor(120);
    cjkText(pdf,"Image: "+(S.imgName||"-"),mg,25,9,[120,120,120]);pdf.text("Date: "+new Date().toLocaleString(),mg,30);
    pdf.text("Scale: "+(S.pxPerUnit?fmt(S.pxPerUnit)+" px = 1 "+S.unit:"not calibrated"),mg,35);
    pdf.setDrawColor(200);pdf.line(mg,39,pw-mg,39);
    const sc=Math.min(2,Math.max(1,1400/Math.max(S.img.width,S.img.height)));const pc=renderPhoto(sc);
    const availW=pw-mg*2;let iw=availW,ih=iw*pc.height/pc.width;const maxIh=150;if(ih>maxIh){ih=maxIh;iw=ih*pc.width/pc.height;}
    const ix=(pw-iw)/2,iy=44;pdf.addImage(pc.toDataURL("image/jpeg",0.92),"JPEG",ix,iy,iw,ih);
    try{drawVectorOverlay(pdf,ix,iy,iw,ih,sc);}catch(err){console.error("vector overlay failed, falling back to raster",err);const oc=renderAnnotated(sc);pdf.addImage(oc.toDataURL("image/jpeg",0.92),"JPEG",ix,iy,iw,ih);}
    pdf.setDrawColor(220);pdf.rect(ix,iy,iw,ih);
    let y=iy+ih+12;pdf.setFont("helvetica","bold");pdf.setFontSize(11);pdf.setTextColor(30);pdf.text("Measurements",mg,y);y+=6;
    pdf.setFontSize(9);const c1=mg+2,c2=mg+30,c3=mg+70;pdf.setFillColor(240);pdf.rect(mg,y-4,availW,7,"F");pdf.setTextColor(80);
    pdf.text("Label",c1,y);pdf.text("Type",c2,y);pdf.text("Value / Detail",c3,y);y+=7;
    pdf.setFont("helvetica","normal");pdf.setTextColor(40);let total=0,any=false;
    S.measures.forEach(m=>{if(y>ph-20){pdf.addPage();y=20;}const c=computeShape(m);if(c.kind==="length"&&c.value!=null){total+=c.value;any=true;}pdf.setDrawColor(235);pdf.line(mg,y+2,pw-mg,y+2);
      const val=asc(c.text)+(c.detail?"  ("+asc(c.detail)+")":"");
      cjkText(pdf,String(m.label).slice(0,22),c1,y,9,[40,40,40]);pdf.text(SHAPES[m.type].en,c2,y);cjkText(pdf,val.slice(0,60),c3,y,9,[40,40,40]);y+=7;});
    if(!S.measures.length){pdf.setTextColor(150);pdf.text("(no measurements)",c1,y);y+=7;}
    if(any){pdf.setFont("helvetica","bold");pdf.setTextColor(20);pdf.text("Total length",c1,y+1);pdf.text(asc(fmt(total)+" "+S.unit),c3,y+1);}
    pdf.setFontSize(8);pdf.setTextColor(160);pdf.text("Generated by Camera Measure tool",mg,ph-8);
    pdf.save((S.imgName.replace(/\.[^.]+$/,"")||"measure")+"_report.pdf");toast(L("toastPdfDone"));
  }
  function asc(s){return(s+"").replace(/²/g,"^2").replace(/⌒/g,"arc ").replace(/×/g,"x").replace(/Ø/g,"D");}

  function toast(msg){const t=$("toast");t.textContent=msg;t.classList.add("on");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("on"),1900);}

  // ---------- 悬浮约束键 + 方向键 + 面板收起 + 触屏 ----------
  function updateFloatUI(){
    const dp=$("dpadwrap");if(dp)dp.classList.toggle("nosel",S.selId==null);
    const cb=$("cbtnShift");if(cb)cb.classList.toggle("on",S.constrain);
  }
  // 约束按钮（等价 Shift）
  $("cbtnShift").addEventListener("click",e=>{e.preventDefault();S.constrain=!S.constrain;updateFloatUI();});
  // 面板收起/展开
  function togglePanel(){document.body.classList.toggle("panel-hidden");resize();}
  $("panelBtn").addEventListener("click",togglePanel);
  $("asideCollapse").addEventListener("click",togglePanel);
  // 拖动侧栏左边线调整宽度（最大不超过默认宽度）
  (function(){
    const aside=document.querySelector("aside"),rz=$("asideResize");
    if(!aside||!rz)return;
    const MAXW=236,MINW=168;
    let dragging=false,startX=0,startW=0;
    rz.addEventListener("pointerdown",e=>{
      dragging=true;startX=e.clientX;startW=aside.getBoundingClientRect().width;
      rz.classList.add("dragging");document.body.style.cursor="ew-resize";
      try{rz.setPointerCapture(e.pointerId);}catch(_){}
      e.preventDefault();
    });
    rz.addEventListener("pointermove",e=>{
      if(!dragging)return;
      let w=startW-(e.clientX-startX);
      w=Math.max(MINW,Math.min(MAXW,w));
      aside.style.width=w+"px";resize();
    });
    const end=()=>{if(!dragging)return;dragging=false;rz.classList.remove("dragging");document.body.style.cursor="";};
    rz.addEventListener("pointerup",end);
    rz.addEventListener("pointercancel",end);
    rz.addEventListener("dblclick",()=>{aside.style.width=MAXW+"px";resize();});
  })();
  // 触屏没有 Esc / Enter / 双击也不好按，绘制过程中给一条可见的操作条
  const IS_TOUCH=(typeof window!=="undefined")&&(("ontouchstart" in window)||((navigator.maxTouchPoints||0)>0));
  function updatePlaceBar(){
    const bar=$("placeBar");if(!bar)return;
    const on=!!(S.placing&&IS_TOUCH);
    bar.classList.toggle("on",on);
    if(on){
      const type=S.placing.type;
      // 定点数图形（直线/矩形…）放够点会自动收尾，"完成"对它没意义
      const need=SHAPES[type]?SHAPES[type].click:2;
      const finished=need>0&&S.placing.pts.length>=need;
      const doneBtn=$("pbDone");if(doneBtn)doneBtn.style.display=finished?"none":"";
    }
  }
  $("pbUndo").addEventListener("click",e=>{
    e.preventDefault();if(!S.placing)return;
    const p=S.placing.pts;
    if(p.length<=1)cancelPlacing();
    else{p.pop();S.adjusting=false;S.cursorImg=null;S.snapPt=null;T.lastTapT=0;T.lastTapSp=null;draw();}
    updatePlaceBar();
  });
  $("pbDone").addEventListener("click",e=>{e.preventDefault();finalizePlacing();updatePlaceBar();});
  $("pbCancel").addEventListener("click",e=>{e.preventDefault();cancelPlacing();updatePlaceBar();});
  // 方向键长按连发
  function bindHold(btn,fn){
    let iv=null,to=null,active=false;
    const start=e=>{e.preventDefault();if(active)return;active=true;fn();to=setTimeout(()=>{iv=setInterval(fn,60);},320);};
    const stop=()=>{if(!active)return;active=false;clearTimeout(to);clearInterval(iv);iv=to=null;if(S.nudged){S.nudged=false;commit();}};
    btn.addEventListener("pointerdown",start);
    btn.addEventListener("pointerup",stop);
    btn.addEventListener("pointerleave",stop);
    btn.addEventListener("pointercancel",stop);
    btn.addEventListener("contextmenu",e=>e.preventDefault());
  }
  document.querySelectorAll("#dpadwrap .dpad .fbtn[data-nudge]").forEach(btn=>{
    const parts=btn.getAttribute("data-nudge").split(",");const ux=parseInt(parts[0],10),uy=parseInt(parts[1],10);
    bindHold(btn,()=>{if(S.selId==null)return;const step=S.constrain?10:1;nudge(ux*step,uy*step);});
  });

  // ---------- 触屏交互 ----------
  function touchPos(t){const r=canvas.getBoundingClientRect();return{x:t.clientX-r.left,y:t.clientY-r.top};}
  const T={mode:null,startSp:null,viewStart:null,pinchDist:0,pinchMid:null,pinchScale:0,moved:false,startT:0,lastTapT:0,lastTapSp:null,tapCandidate:null};
  function dist2(a,b){return Math.hypot(a.x-b.x,a.y-b.y);}
  canvas.addEventListener("touchstart",e=>{
    if(!S.img){return;}
    e.preventDefault();
    if(e.touches.length===1){
      const sp=touchPos(e.touches[0]);T.startSp=sp;T.moved=false;T.startT=Date.now();T.tapCandidate=sp;
      if(S.mode==="select"){
        // 尝试抓取手柄/标签/本体
        selectDown(sp,{shiftKey:false});
        if(S.drag){T.mode="drag";drawLoupe(sp,true);return;}
        T.mode="pan";T.viewStart={ox:S.view.ox,oy:S.view.oy};return;
      }
      if(SHAPES[S.mode]||S.mode==="calibrate"){
        // 放置模式：先检测双击完成多边形/样条
        const now=Date.now();
        if(S.placing&&(S.placing.type==="polygon"||S.placing.type==="spline")&&T.lastTapSp&&(now-T.lastTapT)<320&&dist2(sp,T.lastTapSp)<DUP_TAP_PX){
          popLastIfDuplicate(S.placing.pts);finalizePlacing();
          T.lastTapT=0;T.lastTapSp=null;T.mode=null;T.tapCandidate=null;return;
        }
        // 按下即定点，可拖动微调，松开确定
        placementClick(sp,{shiftKey:S.constrain});
        T.mode="place";drawLoupe(sp,true);return;
      }
      // 其它：平移
      T.mode="pan";T.viewStart={ox:S.view.ox,oy:S.view.oy};
    }else if(e.touches.length>=2){
      // 双指手势：只冻结"正在微调的那个点"，【不再丢弃已放好的点】。
      // 旧行为会 pop 掉当前点，而双指恰恰是绘制途中平移/缩放的唯一手段，等于一平移就丢点。
      if(S.adjusting&&S.placing){S.adjusting=false;S.cursorImg=null;draw();}
      S.drag=null;S.dragMoved=false;T.mode="pinch";loupeEl.style.display="none";
      const a=touchPos(e.touches[0]),b=touchPos(e.touches[1]);
      T.pinchDist=dist2(a,b);T.pinchMid=mid(a,b);T.pinchScale=S.view.scale;
      T.pinchImg=screenToImg(T.pinchMid);
    }
  },{passive:false});
  canvas.addEventListener("touchmove",e=>{
    if(!S.img)return;e.preventDefault();
    if(T.mode==="pinch"&&e.touches.length>=2){
      const a=touchPos(e.touches[0]),b=touchPos(e.touches[1]);
      const nd=dist2(a,b),nmid=mid(a,b);
      const f=nd/(T.pinchDist||1);
      S.view.scale=Math.min(80,Math.max(0.02,T.pinchScale*f));
      S.view.ox=nmid.x-T.pinchImg.x*S.view.scale;
      S.view.oy=nmid.y-T.pinchImg.y*S.view.scale;
      draw();updateStatus(nmid);return;
    }
    if(e.touches.length!==1)return;
    const sp=touchPos(e.touches[0]);
    if(dist2(sp,T.startSp)>6)T.moved=true;
    if(T.mode==="drag"&&S.drag){dragMove(sp,{shiftKey:S.constrain});drawLoupe(sp,true);return;}
    if(T.mode==="place"&&S.placing&&S.adjusting){
      updateExtSeg(sp);const ipRaw=screenToImg(sp);
      const idx=S.placing.pts.length-1;const prev=idx>0?S.placing.pts[idx-1]:null;
      const r=placePoint(prev,ipRaw,S.placing.type,S.constrain,sp);
      S.placing.pts[idx]=r.pt;S.cursorImg=r.pt;S.snapPt=r.snap;draw();drawLoupe(sp,true);return;
    }
    if(T.mode==="pan"){S.view.ox=T.viewStart.ox+(sp.x-T.startSp.x);S.view.oy=T.viewStart.oy+(sp.y-T.startSp.y);draw();updateStatus(sp);}
  },{passive:false});
  canvas.addEventListener("touchend",e=>{
    if(!S.img)return;
    if(T.mode==="drag"){if(S.drag){const moved=S.dragMoved;S.drag=null;S.dragMoved=false;if(moved)commit();}loupeEl.style.display="none";T.mode=null;return;}
    if(T.mode==="pinch"){if(e.touches.length===0)T.mode=null;return;}
    if(T.mode==="place"){
      // 记录本次点击用于双击（完成多边形/样条）检测
      if(!T.moved&&T.tapCandidate){T.lastTapT=Date.now();T.lastTapSp=T.tapCandidate;}
      placementUp();loupeEl.style.display="none";T.mode=null;T.tapCandidate=null;return;
    }
    if(T.mode==="pan"&&!T.moved&&T.tapCandidate){
      const sp=T.tapCandidate;const now=Date.now();
      // 双击检测：选择模式插入顶点
      if(T.lastTapSp&&(now-T.lastTapT)<320&&dist2(sp,T.lastTapSp)<24){
        if(S.mode==="select"){tryInsertVertex(sp);}
        T.lastTapT=0;T.lastTapSp=null;T.mode=null;T.tapCandidate=null;return;
      }
      T.lastTapT=now;T.lastTapSp=sp;
      if(S.mode==="select"){selectDown(sp,{shiftKey:false});}
    }
    loupeEl.style.display="none";T.mode=null;T.tapCandidate=null;
  },{passive:false});
  canvas.addEventListener("touchcancel",()=>{S.drag=null;S.dragMoved=false;S.adjusting=false;T.mode=null;loupeEl.style.display="none";});

  // init
  S.lang=resolveLang();setMenuSel("langMenu",S.langPref);applyStaticLang();
  setMenuSel("themeMenu",S.themePref);applyTheme();
  if(window.innerWidth<820)document.body.classList.add("panel-hidden");
  // 触屏设备默认打开放大镜
  if(("ontouchstart" in window)||(navigator.maxTouchPoints>0)){S.loupe=true;const lb=$("btnLoupe");if(lb)lb.classList.add("active");}
  resize();updateScaleUI();setMode("line");histReset();updateFloatUI();
})();
</script>
