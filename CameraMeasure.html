<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>图像测量工具 · Camera Measure</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1d212b; --line:#2a303c;
    --txt:#e6e9ef; --muted:#9aa4b2; --accent:#4c9aff; --accent2:#38d39f;
    --danger:#ff5c68; --warn:#ffc857;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:-apple-system,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;background:var(--bg);color:var(--txt);overflow:hidden}
  /* 100dvh 规避移动 Safari 地址栏导致的视口跳动；不支持时回退到 100vh */
  #app{display:flex;flex-direction:column;height:100vh;height:100dvh}

  header,.toolbar2{display:flex;align-items:center;gap:6px;padding:7px 12px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
  header{position:relative;z-index:20}
  .toolbar2{background:var(--panel2);padding:6px 12px;position:relative;z-index:10}
  header .title{font-weight:600;font-size:15px;margin-right:6px;letter-spacing:.3px}
  header .title span{color:var(--accent)}
  .sep{width:1px;height:20px;background:var(--line);margin:0 3px}
  button.tool{background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:7px;padding:6px 10px;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:5px;transition:.12s;white-space:nowrap}
  .toolbar2 button.tool{background:#161a22}
  button.tool:hover{border-color:var(--accent);color:#fff}
  button.tool.active{background:var(--accent);border-color:var(--accent);color:#fff}
  button.tool.g2{border-color:#33507a}
  button.tool.tg.active{background:var(--accent2);border-color:var(--accent2);color:#04120c}
  button.tool.danger:hover{border-color:var(--danger);color:var(--danger)}
  button.tool:disabled{opacity:.4;cursor:not-allowed}
  .ic{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:middle}
  .toolbar2 button.tool[data-tip]{position:relative;padding:6px 9px}
  .toolbar2 button.tool[data-tip] .ic{width:17px;height:17px}
  .toolbar2 button.tool[data-tip]::after{content:attr(data-tip);position:absolute;left:50%;top:calc(100% + 7px);transform:translateX(-50%);background:rgba(29,33,43,.97);border:1px solid var(--line);color:var(--txt);font-size:12px;padding:3px 9px;border-radius:6px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .1s;z-index:40;box-shadow:0 3px 10px rgba(0,0,0,.4)}
  .toolbar2 button.tool[data-tip]:hover::after{opacity:1}
  /* header icon-only buttons with hover tooltip */
  header .tool.ico{position:relative;padding:6px 9px}
  header .tool.ico .bi{font-size:15px;line-height:1;display:inline-flex}
  header .tool.ico .bl{display:none}
  header .menubtn{padding:6px 8px}
  header .menubtn .mlabel{display:none}
  header .tool[data-tip]::after{content:attr(data-tip);position:absolute;left:50%;top:calc(100% + 7px);transform:translateX(-50%);background:rgba(29,33,43,.97);border:1px solid var(--line);color:var(--txt);font-size:12px;padding:3px 9px;border-radius:6px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .1s;z-index:60;box-shadow:0 3px 10px rgba(0,0,0,.4)}
  header .tool[data-tip]:hover::after{opacity:1}
  html[data-theme="light"] header .tool[data-tip]::after{background:rgba(255,255,255,.97);box-shadow:0 3px 10px rgba(0,0,0,.15)}
  .spacer{flex:1}
  .grp{font-size:11px;color:var(--muted);margin:0 2px 0 4px}

  main{flex:1;display:flex;min-height:0;position:relative}
  #stage{flex:1;position:relative;background:
    linear-gradient(45deg,#12141a 25%,transparent 25%),
    linear-gradient(-45deg,#12141a 25%,transparent 25%),
    linear-gradient(45deg,transparent 75%,#12141a 75%),
    linear-gradient(-45deg,transparent 75%,#12141a 75%);
    background-size:22px 22px;background-position:0 0,0 11px,11px -11px,-11px 0px;overflow:hidden}
  #canvas{position:absolute;top:0;left:0}
  #loupe{position:absolute;width:152px;height:152px;border-radius:50%;border:2px solid #fff;box-shadow:0 4px 18px rgba(0,0,0,.6);pointer-events:none;display:none;z-index:20;background:#000}
  #hint{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:var(--muted);text-align:center;pointer-events:none;font-size:14px;line-height:1.9}
  #hint b{color:var(--txt)}
  #toolhint{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:rgba(29,33,43,.9);border:1px solid var(--line);border-radius:20px;padding:5px 14px;font-size:12.5px;color:var(--txt);pointer-events:none;display:none}
  #toolhint b{color:var(--accent2)}
  #statusbar{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));background:rgba(15,17,21,.82);border:1px solid var(--line);border-radius:7px;padding:6px 10px;font-size:12px;color:var(--muted);pointer-events:none;font-variant-numeric:tabular-nums}
  #statusbar .k{color:var(--accent2)}

  aside{width:236px;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;position:relative}
  #asideResize{position:absolute;left:-6px;top:0;bottom:0;width:14px;cursor:ew-resize;z-index:10;touch-action:none;display:flex;align-items:center;justify-content:center}
  #asideResize::before{content:"";width:5px;height:32px;border-left:2px solid var(--muted);border-right:2px solid var(--muted);border-radius:1px;opacity:.55;transition:.12s}
  #asideResize:hover::before,#asideResize.dragging::before{border-color:var(--accent);opacity:1;height:52px}
  .scalebox{padding:11px 14px;border-bottom:1px solid var(--line);font-size:13px}
  .scalebox .row{display:flex;justify-content:space-between;align-items:center;margin:4px 0}
  .scalebox .row>span:first-child{white-space:nowrap}
  .lockbtn{border:1px solid var(--line);background:var(--panel2);color:var(--txt);border-radius:6px;padding:3px 9px;font-size:12px;cursor:pointer;white-space:nowrap;font-weight:600}
  .lockbtn.locked{border-color:var(--danger);color:var(--danger)}
  .lockbtn.unlocked{border-color:var(--accent2);color:var(--accent2)}
  .lockbtn:hover{filter:brightness(1.15)}
  #btnCalib.disabled{opacity:.45}
  .scalebox .val{color:var(--accent2);font-variant-numeric:tabular-nums}
  .stylebox .wctl .val{min-width:34px;text-align:right;display:inline-block}
  .scalebox .noscale{color:var(--warn)}
  .anglebox{padding:0;font-size:13px}
  .anglebox>summary{padding:11px 14px;cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;user-select:none}
  .anglebox>summary::-webkit-details-marker{display:none}
  .anglebox>summary::after{content:"⌄";color:var(--muted);transition:transform .2s}
  .anglebox[open]>summary::after{transform:rotate(180deg)}
  .anglebox .amini{color:var(--muted);font-weight:400;font-size:11px}
  .agrid{display:flex;flex-direction:column;gap:7px;padding:2px 14px 12px}
  .agrid .arow{display:flex;align-items:center;gap:8px}
  .agrid .arow .asl{flex:1;min-width:0;height:16px;cursor:pointer;accent-color:var(--accent)}
  .agrid .ain{width:52px;flex:none;background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:6px;padding:5px 6px;font-size:12px;text-align:center}
  .agrid .ain:focus{outline:none;border-color:var(--accent)}
  .side-h{padding:10px 14px;border-bottom:1px solid var(--line);font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:space-between}
  .mlist{flex:1;overflow-y:auto;padding:6px}
  .mitem{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:6px 4px;font-size:13px;display:flex;flex-direction:column;gap:4px;cursor:pointer;transition:.12s}
  .mitem:hover{border-color:#33507a}
  .mitem.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
  .mitem .top{display:flex;align-items:center;justify-content:space-between;gap:6px}
  .mitem .name{display:flex;align-items:center;gap:7px;min-width:0;flex:1}
  .swatch{width:11px;height:11px;border-radius:3px;flex:none}
  .mitem .lbl{background:transparent;border:none;color:var(--txt);font-size:13px;font-weight:600;padding:2px 4px;border-radius:4px;width:100%;min-width:0}
  .mitem .lbl:focus{outline:none;background:#0f1115}
  .badge{font-size:10.5px;color:var(--muted);border:1px solid var(--line);border-radius:20px;padding:1px 7px;flex:none}
  .mitem .len{font-variant-numeric:tabular-nums;color:var(--accent2);font-weight:600;font-size:13.5px}
  .mitem .det{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
  .mitem .del{background:none;border:none;color:var(--muted);cursor:pointer;font-size:15px;padding:0 3px;line-height:1;flex:none}
  .mitem .del:hover{color:var(--danger)}
  .stylebox .wctl{display:flex;align-items:center;gap:8px}
  .stylebox input[type=range]{width:120px;accent-color:var(--accent)}
  .wsrow{display:flex;align-items:center;gap:8px;padding:1px 0 3px}
  .wsrow input[type=range]{flex:1;min-width:0;width:auto;accent-color:var(--accent)}
  .wbox{width:52px;flex:none;background:var(--panel);border:1px solid var(--line);color:var(--txt);border-radius:5px;padding:3px 4px;font-size:12px;text-align:center;font-variant-numeric:tabular-nums}
  .wbox:focus{outline:none;border-color:var(--accent)}
  input.cin{width:34px;height:22px;padding:0;border:1px solid var(--line);border-radius:5px;background:none;cursor:pointer}
  /* 常用标准色（20 色） */
  .swatches{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;padding:1px 14px 10px}
  .swatches .sw{height:16px;border-radius:4px;border:1px solid rgba(127,127,127,.45);cursor:pointer;padding:0;transition:transform .1s}
  .swatches .sw:hover{transform:scale(1.18);border-color:var(--txt)}
  .swatches .sw.sel{box-shadow:0 0 0 2px var(--panel),0 0 0 3.5px var(--txt)}
  html[data-theme="light"] .swatches .sw{border-color:rgba(0,0,0,.18)}
  .stylebox .tip{font-size:11px;color:var(--muted);line-height:1.5;padding:3px 14px 0}
  .mitem .style{display:flex;align-items:center;gap:8px;padding-top:2px;border-top:1px dashed var(--line);margin-top:1px}
  .mitem .style input[type=color]{width:26px;height:20px;padding:0;border:1px solid var(--line);border-radius:4px;background:none;cursor:pointer}
  .mitem .style .mw{flex:1;min-width:0;height:16px;cursor:pointer;accent-color:var(--accent)}
  .mitem .style .mwbox{width:44px;flex:none;background:var(--panel);border:1px solid var(--line);color:var(--txt);border-radius:5px;padding:2px 3px;font-size:12px;text-align:center;font-variant-numeric:tabular-nums}
  .mitem .style .mwbox:focus{outline:none;border-color:var(--accent)}
  .mitem .style .rst{background:none;border:1px solid var(--line);color:var(--muted);border-radius:5px;cursor:pointer;font-size:12px;padding:2px 6px;line-height:1.2}
  .mitem .style .rst:hover{border-color:var(--accent);color:#fff}
  .mitem .style .cap{font-size:11px;color:var(--muted)}
  .mitem .style.dashrow{border-top:0;padding-top:0}
  .mitem .style.dashrow .dashlbl{flex:none;white-space:nowrap}
  .mitem .style.dashrow .dashr{flex:1;min-width:0;height:16px;cursor:pointer;accent-color:var(--accent)}
  .mitem .style.dashrow .dashval{min-width:16px;text-align:right;font-variant-numeric:tabular-nums;color:var(--txt)}
  .empty{color:var(--muted);text-align:center;padding:26px 16px;font-size:13px;line-height:1.7}
  .foot{padding:10px 14px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);display:flex;justify-content:space-between}

  .mask{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:50}
  .mask.on{display:flex}
  .dlg{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;width:340px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
  .dlg h3{margin:0 0 4px;font-size:15px}
  .dlg p{margin:0 0 14px;color:var(--muted);font-size:13px}
  .dlg .field{display:flex;gap:8px;margin-bottom:14px}
  .dlg input{flex:1;background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:7px;padding:9px 11px;font-size:14px}
  .dlg input:focus{outline:none;border-color:var(--accent)}
  .dlg select{background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:7px;padding:9px;font-size:14px}
  .dlg .btns{display:flex;justify-content:flex-end;gap:8px}
  .dlg button{border-radius:7px;padding:8px 15px;font-size:13px;cursor:pointer;border:1px solid var(--line);background:var(--panel2);color:var(--txt)}
  .dlg button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  /* help dialog */
  .dlg.help{width:560px;max-width:92vw;max-height:86vh;display:flex;flex-direction:column}
  .dlg.help .hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .dlg.help h3{margin:0;font-size:16px}
  .dlg.help .xclose{border:1px solid var(--line);background:var(--panel2);color:var(--muted);border-radius:7px;width:28px;height:28px;font-size:16px;line-height:1;cursor:pointer;flex:none}
  .dlg.help .xclose:hover{color:var(--txt);border-color:var(--accent)}
  .helpbody{overflow-y:auto;padding-right:6px;font-size:13px;line-height:1.62;color:var(--txt)}
  .helpbody h4{margin:16px 0 6px;font-size:13.5px;color:var(--accent);border-bottom:1px solid var(--line);padding-bottom:4px}
  .helpbody h4:first-child{margin-top:0}
  .helpbody p{margin:6px 0;color:var(--muted)}
  .helpbody ul{margin:6px 0;padding-left:20px}
  .helpbody li{margin:3px 0}
  .helpbody b{color:var(--txt)}
  .helpbody kbd{background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:1px 6px;font-size:11.5px;font-family:inherit;color:var(--txt)}
  .helpbody::-webkit-scrollbar{width:9px}
  .helpbody::-webkit-scrollbar-thumb{background:var(--line);border-radius:5px}
  #toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--panel2);border:1px solid var(--line);color:var(--txt);padding:9px 16px;border-radius:8px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:60}
  #toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

  /* drag & drop import overlay */
  #dropMask{position:fixed;inset:0;background:rgba(76,154,255,.14);display:none;align-items:center;justify-content:center;z-index:80;pointer-events:none}
  #dropMask.on{display:flex}
  #dropMask::before{content:"";position:absolute;inset:10px;border:2px dashed var(--accent);border-radius:14px}
  #dropMask .dcard{position:relative;background:var(--panel);border:1px solid var(--accent);border-radius:14px;padding:22px 30px;font-size:14px;color:var(--muted);text-align:center;line-height:1.75;box-shadow:0 20px 60px rgba(0,0,0,.45)}
  #dropMask .dcard b{color:var(--accent);font-size:16px;display:block;margin-bottom:2px}
  html[data-theme="light"] #dropMask{background:rgba(47,127,240,.09)}
  html[data-theme="light"] #dropMask .dcard{box-shadow:0 20px 60px rgba(0,0,0,.18)}

  /* custom dropdown menu (language / theme) */
  .menuwrap{position:relative;display:inline-block}
  .menubtn{display:inline-flex;align-items:center;gap:5px}
  .menubtn .caret{width:10px;height:10px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;opacity:.65;margin-left:1px;flex:none}
  .menu{position:absolute;top:calc(100% + 6px);right:0;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:4px;min-width:160px;box-shadow:0 10px 28px rgba(0,0,0,.38);display:none;z-index:70}
  html[data-theme="light"] .menu{box-shadow:0 10px 28px rgba(0,0,0,.18)}
  .menuwrap.open .menu{display:block}
  .menuitem{display:flex;align-items:center;gap:7px;padding:7px 9px;border-radius:6px;font-size:13px;color:var(--txt);cursor:pointer;white-space:nowrap}
  .menuitem:hover{background:var(--panel);border:0}
  .menuitem .tick{width:13px;text-align:center;color:var(--accent2);opacity:0;font-size:12px;flex:none}
  .menuitem.sel .tick{opacity:1}
  .menuitem.sel{color:var(--accent2)}

  /* ---------- light theme ---------- */
  html[data-theme="light"]{
    --bg:#eef1f6; --panel:#ffffff; --panel2:#f3f5f9; --line:#d3d9e3;
    --txt:#1c2530; --muted:#5c6773; --accent:#2f7ff0; --accent2:#0ca678;
    --danger:#e03e4a; --warn:#b8791f;
  }
  html[data-theme="light"] #stage{background:
    linear-gradient(45deg,#e2e6ee 25%,transparent 25%),
    linear-gradient(-45deg,#e2e6ee 25%,transparent 25%),
    linear-gradient(45deg,transparent 75%,#e2e6ee 75%),
    linear-gradient(-45deg,transparent 75%,#e2e6ee 75%);
    background-size:22px 22px;background-position:0 0,0 11px,11px -11px,-11px 0px}
  html[data-theme="light"] .toolbar2 button.tool:not(.active){background:#eef1f6}
  html[data-theme="light"] button.tool:not(.active):hover{color:var(--txt)}
  html[data-theme="light"] #toolhint{background:rgba(255,255,255,.92)}
  html[data-theme="light"] #statusbar{background:rgba(255,255,255,.86);color:var(--muted)}
  html[data-theme="light"] .toolbar2 button.tool[data-tip]::after{background:rgba(255,255,255,.97);color:var(--txt);box-shadow:0 3px 10px rgba(0,0,0,.15)}

  /* ===== touch / canvas ===== */
  #stage,#canvas{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}

  /* ===== collapsible side panel ===== */
  aside{transition:margin-right .22s ease}
  body.panel-hidden aside{display:none}
  #panelBtn{position:absolute;top:10px;right:10px;z-index:41;width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:rgba(23,26,33,.9);color:var(--txt);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px;line-height:1;box-shadow:0 2px 10px rgba(0,0,0,.35)}
  #panelBtn:hover{border-color:var(--accent);color:#fff}
  #panelBtn .pc{transition:transform .2s}
  body.panel-hidden #panelBtn .pc{transform:rotate(180deg)}
  html[data-theme="light"] #panelBtn{background:rgba(255,255,255,.92)}
  .side-h .sh-x{background:none;border:1px solid var(--line);color:var(--muted);border-radius:6px;cursor:pointer;font-size:13px;line-height:1;padding:3px 8px}
  .side-h .sh-x:hover{border-color:var(--accent);color:var(--txt)}

  /* ===== floating constraint (bottom-left) + dpad (bottom-right) ===== */
  /* 底部悬浮控件必须避开 iOS home indicator / Android 手势条 */
  #floatpad{position:absolute;left:calc(10px + env(safe-area-inset-left,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:31;opacity:.92}
  #dpadwrap{position:absolute;right:calc(10px + env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:31;opacity:.92}
  /* 绘制中出现的浮动操作条：触屏没有 Esc / Enter，必须给可见的入口 */
  /* 抬到状态栏上方：两者都是底部居中，同高会叠在一起 */
  #placeBar{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(48px + env(safe-area-inset-bottom,0px));z-index:33;display:none;gap:8px;align-items:center}
  #placeBar.on{display:flex}
  #placeBar .pb{height:44px;min-width:54px;padding:0 14px;font-size:13px;font-weight:600;border-radius:12px;background:rgba(23,26,33,.92);border:1px solid var(--line);color:var(--txt);cursor:pointer;white-space:nowrap;-webkit-tap-highlight-color:transparent;touch-action:none}
  #placeBar .pb:active{transform:scale(.94)}
  #placeBar .pb.done{background:var(--accent2);border-color:var(--accent2);color:#04120c}
  #placeBar .pb.cancel{background:rgba(23,26,33,.92);border-color:var(--danger);color:var(--danger)}
  html[data-theme="light"] #placeBar .pb{background:rgba(255,255,255,.94)}
  html[data-theme="light"] #placeBar .pb.done{background:var(--accent2);color:#04120c}
  .fbtn{background:rgba(23,26,33,.82);border:1px solid var(--line);color:var(--txt);border-radius:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;line-height:1;box-shadow:0 2px 9px rgba(0,0,0,.32);-webkit-tap-highlight-color:transparent;touch-action:none;user-select:none}
  .fbtn:active{transform:scale(.93)}
  html[data-theme="light"] .fbtn{background:rgba(255,255,255,.9)}
  #cbtnShift{width:92px;height:36px;gap:6px;font-size:13px;font-weight:600}
  #cbtnShift .sk{font-size:16px}
  #cbtnShift.on{background:var(--accent2);border-color:var(--accent2);color:#04120c}

<script>

(function(){

    arc:      {label:"弧线",  en:"Arc",      click:3, hint:"点击弧线上三点"},
    circle:   {label:"圆形",  en:"Circle",   click:2, hint:"先点圆心，再点圆周确定半径"},
    circle3:  {label:"圆(三点)",en:"Circle3", click:3, hint:"点击圆周上任意三点定圆"},
    ellipse:  {label:"椭圆",  en:"Ellipse",  click:2, hint:"点外接矩形对角两点（按住 Shift = 正圆）"},
    rect:     {label:"矩形",  en:"Rect",     click:2, hint:"点对角两点（按住 Shift = 正方形）"},
    polygon:  {label:"多边形",en:"Polygon",  click:0, hint:"依次点击各顶点，双击或回车闭合"},
    spline:   {label:"样条曲线",en:"Spline", click:0, hint:"依次点击控制点，双击或回车结束"},

  // 常用标准色（20 色）：覆盖整圈色相，并额外提供白 / 近黑，便于在任意底色的照片上都看得清
  const STD_COLORS=["#ff3b30","#ff6b35","#ff9500","#ffcc00","#a3e635","#34c759","#00c78c","#00c7be",
                    "#32ade6","#0a84ff","#4f7cff","#5e5ce6","#9b5de5","#d64bd6","#ff5bb0","#ff4d6a",
                    "#a2845e","#8e8e93","#ffffff","#1c1c1e"];

  const S={
    img:null, imgName:"", imgData:"",
    view:{scale:1,ox:0,oy:0},
    mode:"line", unit:"cm", pxPerUnit:null, calibLine:null,
    measures:[], selId:null, active:-1,
    placing:null, cursorImg:null,
    drag:null, panning:false, panStart:null, viewStart:null,

    langPref:"auto", lang:"zh",
    themePref:"auto", theme:"dark",
    nextId:1, counters:{}

  // ---------- i18n ----------
  const I18N={
    zh:{
      docTitle:"图像测量工具 · Camera Measure",
      appTitle:'图像测量 <span>Measure</span>',
      btnOpen:"📂 导入图片", btnCalib:"📏 设置标尺", btnLoupe:"🔍 放大镜", btnRadius:"◔ 半径",
      btnZoomFit:"⤢ 适应窗口", btnImport:"⬇ 导入工程", btnExport:"⬆ 导出工程", btnPng:"🖼 导出图片", btnCsv:"📊 导出表格", btnPdf:"📄 导出 PDF", btnHelp:"❓ 说明",
      helpTitle:"使用说明",
      helpBody:`
        <h4>快速上手</h4>
        <p>四步完成一次测量：</p>
        <ul>
          <li><b>① 导入图片</b>：点顶部「📂 导入图片」加载照片，也可以直接<b>把图片拖进窗口</b>，或用 <kbd>Ctrl</kbd>+<kbd>V</kbd> 粘贴剪贴板里的截图。</li>

        <h4>测量工具</h4>
        <ul>
          <li><b>直线</b>：点击两点测量距离。</li>
          <li><b>角度</b>：依次点一条边端点 → 顶点 → 另一条边端点。</li>
          <li><b>平行线</b>：先点基准线两端，再点第三点确定平行线，测量间距。</li>

          <li><b>弧线</b>：点击弧上三点，得半径与弧长。</li>
          <li><b>圆形</b>：先点圆心，再点圆周确定半径。</li>

          <li><b>矩形</b>：点对角两点（按住 <kbd>Shift</kbd> = 正方形）。</li>
          <li><b>多边形</b>：依次点各顶点，<kbd>双击</kbd> 或 <kbd>Enter</kbd> 闭合。</li>

        <ul>
          <li>用「▲ 选择」工具点中某个图形，可拖动整体或单个控制点。</li>

          <li>作图或拖动时会自动<b>吸附</b>到已有端点、圆心、线段及其延长线。</li>
          <li>标注文字可直接拖动到合适位置。</li>
        </ul>

        <h4>辅助功能</h4>
        <ul>
          <li><b>🔍 放大镜</b>：开启后在指针处显示局部放大，便于精准取点。</li>
          <li><b>◔ 半径</b>：切换圆/弧显示半径或直径。</li>
          <li><b>适应窗口</b>：将图片缩放至完整可见。滚轮缩放，按住空格或用「平移」工具拖动画面。</li>

        </ul>

      helpBody:`
        <h4>Quick start</h4>
        <p>A measurement takes four steps:</p>
        <ul>
          <li><b>① Import image</b>: click "📂 Import Image" at the top, <b>drag an image file into the window</b>, or paste a screenshot from the clipboard with <kbd>Ctrl</kbd>+<kbd>V</kbd>.</li>
          <li><b>② Set scale</b>: click "📏 Set Scale", draw a line over a segment of <b>known real length</b> (e.g. 10 cm on a ruler), then enter the length and unit. Real-world sizes are only available after calibration.</li>
          <li><b>③ Pick a tool & draw</b>: choose a measurement type in the left toolbar and click on the image as prompted.</li>
          <li><b>④ Read results</b>: values appear on the image and in the "Measurements" list on the right.</li>
        </ul>

        <h4>Measurement tools</h4>
        <ul>
          <li><b>Line</b>: click two points to measure distance.</li>
          <li><b>Angle</b>: click one edge end → vertex → other edge end.</li>
          <li><b>Parallel</b>: click both ends of the base line, then a third point for the parallel; measures the gap.</li>
          <li><b>Point-line</b>: click both ends of a line, then the target point; measures point-to-line distance.</li>
          <li><b>Arc</b>: click three points on the arc for radius and arc length.</li>
          <li><b>Circle</b>: click the center, then a point on the circumference for the radius.</li>
          <li><b>Circle · 3-pt</b>: click any three points on the circumference.</li>
          <li><b>Ellipse</b>: click two opposite corners of the bounding box (hold <kbd>Shift</kbd> = circle).</li>
          <li><b>Rect</b>: click two opposite corners (hold <kbd>Shift</kbd> = square).</li>
          <li><b>Polygon</b>: click each vertex; <kbd>double-click</kbd> or <kbd>Enter</kbd> to close.</li>
          <li><b>Spline</b>: click control points; <kbd>double-click</kbd> or <kbd>Enter</kbd> to finish.</li>
          <li><b>Guide</b>: click two points to set a direction; the dashed line extends infinitely and is reference-only (not measured).</li>
        </ul>

        <h4>Select & edit</h4>
        <ul>
          <li>Use the "▲ Select" tool to pick a shape, then drag the whole shape or a single handle.</li>
          <li>With a shape selected, <kbd>arrow keys</kbd> nudge by 1 px, <kbd>Shift</kbd>+arrow by 10 px.</li>
          <li>Press <kbd>Delete</kbd> / <kbd>Backspace</kbd> to remove the selection; on a polygon/spline it removes a single vertex.</li>
          <li>Drawing and dragging <b>snap</b> to existing endpoints, centers, segments and their extensions.</li>
          <li>Labels can be dragged to reposition them.</li>
        </ul>

        <h4>Helpers</h4>
        <ul>
          <li><b>🔍 Magnifier</b>: shows a zoomed loupe at the cursor for precise picking.</li>
          <li><b>◔ Radius</b>: toggle circles/arcs between radius and diameter.</li>
          <li><b>Fit</b>: scale the image to fit the view. Scroll to zoom; hold space or use the "Pan" tool to move.</li>
          <li><b>Color / width</b>: set global style on the right; expand a list item to override its color and width individually.</li>
        </ul>

        <h4>Save & export</h4>
        <ul>
          <li><b>⬇ Export</b>: save image, scale and all measurements as a <b>.json</b> project, restored fully via "⬆ Import" (project files can also be dropped into the window).</li>
          <li><b>🖼 Export Image</b>: export a PNG with annotations drawn on it.</li>
          <li><b>📊 Export CSV</b>: export the measurement list as a <b>.csv</b> (UTF-8, opens directly in Excel) for further processing.</li>
          <li><b>📄 Export PDF</b>: generate a report with the image and a measurement list; all lines stay vector.</li>
        </ul>

        <h4>Language / theme</h4>
        <p>Use "🌐 Language" to switch Chinese / English / System, and "🎨 Theme" for Light / Dark / System. These are saved with the project.</p>

  function resolveLang(){
    if(S.langPref==="zh"||S.langPref==="en")return S.langPref;
    const n=((typeof navigator!=="undefined"&&(navigator.language||navigator.userLanguage))||"en").toLowerCase();
    return n.indexOf("zh")===0?"zh":"en";
  }
  function L(k){let s=(I18N[S.lang]&&I18N[S.lang][k]);if(s==null)s=I18N.zh[k];if(s==null)return k;for(let i=1;i<arguments.length;i++)s=s.replace("{"+(i-1)+"}",arguments[i]);return s;}
  function shapeName(t){return S.lang==="en"?((SHAPES[t]&&SHAPES[t].en)||t):((SHAPES[t]&&SHAPES[t].label)||t);}
  function shapeHint(t){return S.lang==="en"?L("hint_"+t):((SHAPES[t]&&SHAPES[t].hint)||"");}
  function applyStaticLang(){
    try{document.title=L("docTitle");}catch(_){}
    if(document.documentElement)document.documentElement.setAttribute("lang",S.lang==="en"?"en":"zh-CN");
    document.querySelectorAll("[data-i18n]").forEach(el=>{el.textContent=L(el.getAttribute("data-i18n"));});
    document.querySelectorAll("[data-i18n-html]").forEach(el=>{el.innerHTML=L(el.getAttribute("data-i18n-html"));});
    document.querySelectorAll("[data-i18n-ph]").forEach(el=>{el.setAttribute("placeholder",L(el.getAttribute("data-i18n-ph")));});
    // tooltips for the drawing toolbar (icon-only buttons)
    document.querySelectorAll(".toolbar2 [data-mode]").forEach(b=>{
      const md=b.dataset.mode;
      const tip=md==="select"?L("tool_select"):md==="pan"?L("tool_pan"):shapeName(md);
      b.setAttribute("data-tip",tip);
    });
    iconifyHeader();
  }
  // 顶部菜单栏：只显示图标，hover 才显示文字（复用 data-tip 气泡）
  function iconifyHeader(){
    document.querySelectorAll("header button.tool[data-i18n]").forEach(b=>{
      const raw=L(b.getAttribute("data-i18n")).trim();
      const sp=raw.indexOf(" ");
      let icon=raw,label="";
      if(sp>0){icon=raw.slice(0,sp);label=raw.slice(sp+1).trim();}
      b.setAttribute("data-tip",label||icon);
      b.classList.add("ico");
      b.innerHTML='<span class="bi"></span><span class="bl"></span>';
      b.querySelector(".bi").textContent=icon;
      b.querySelector(".bl").textContent=label;
    });
    document.querySelectorAll("header .menubtn").forEach(b=>{
      const lbl=b.querySelector("[data-i18n]");
      if(lbl){lbl.classList.add("mlabel");b.setAttribute("data-tip",lbl.textContent.trim());}
    });
  }

  // ---------- theme ----------
  function resolveTheme(){
    if(S.themePref==="light"||S.themePref==="dark")return S.themePref;
    if(typeof window!=="undefined"&&typeof window.matchMedia==="function"){
      try{return window.matchMedia("(prefers-color-scheme: light)").matches?"light":"dark";}catch(_){}
    }
    return "dark";
  }
  function applyTheme(){
    S.theme=resolveTheme();
    if(document.documentElement)document.documentElement.setAttribute("data-theme",S.theme);
  }
  // 跟随系统主题变化（仅在“系统默认”时生效）
  (function(){
    if(typeof window!=="undefined"&&typeof window.matchMedia==="function"){
      try{const mq=window.matchMedia("(prefers-color-scheme: light)");
        const h=()=>{if(S.themePref==="auto")applyTheme();};
        if(mq.addEventListener)mq.addEventListener("change",h);else if(mq.addListener)mq.addListener(h);
      }catch(_){}
    }
  })();

  // ---------- math ----------
  const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
  const mid=(a,b)=>({x:(a.x+b.x)/2,y:(a.y+b.y)/2});
  function fmt(n){if(n==null||!isFinite(n))return"—";const a=Math.abs(n);let d=a>=100?1:a>=10?2:3;return n.toFixed(d).replace(/\.?0+$/,'');}
  const px2u=px=>S.pxPerUnit?px/S.pxPerUnit:null;
  function U(v,dim){if(v==null)return L("notCalibrated");return fmt(v)+" "+S.unit+(dim===2?"²":"");}
  const calibText=()=>S.calibLine?(L("scalePrefix")+fmt(S.calibLine.realLen)+S.calibLine.unit):"";
  function imgToScreen(p){return{x:p.x*S.view.scale+S.view.ox,y:p.y*S.view.scale+S.view.oy};}
  function screenToImg(p){return{x:(p.x-S.view.ox)/S.view.scale,y:(p.y-S.view.oy)/S.view.scale};}

  function pointLineDist(P,A,B){const dx=B.x-A.x,dy=B.y-A.y,len=Math.hypot(dx,dy)||1e-9;return Math.abs((P.x-A.x)*dy-(P.y-A.y)*dx)/len;}
  function footOnLine(P,A,B){const dx=B.x-A.x,dy=B.y-A.y,l2=dx*dx+dy*dy||1e-9;const t=((P.x-A.x)*dx+(P.y-A.y)*dy)/l2;return{x:A.x+dx*t,y:A.y+dy*t};}
  function pointSegDist(P,A,B){const dx=B.x-A.x,dy=B.y-A.y,l2=dx*dx+dy*dy;if(l2<1e-9)return dist(P,A);let t=((P.x-A.x)*dx+(P.y-A.y)*dy)/l2;t=Math.max(0,Math.min(1,t));return dist(P,{x:A.x+dx*t,y:A.y+dy*t});}
  function angleDeg(a,v,b){const v1={x:a.x-v.x,y:a.y-v.y},v2={x:b.x-v.x,y:b.y-v.y};const d=Math.hypot(v1.x,v1.y)*Math.hypot(v2.x,v2.y)||1e-9;let c=(v1.x*v2.x+v1.y*v2.y)/d;c=Math.max(-1,Math.min(1,c));return Math.acos(c)*180/Math.PI;}
  function circumcircle(A,B,C){const ax=A.x,ay=A.y,bx=B.x,by=B.y,cx=C.x,cy=C.y;const d=2*(ax*(by-cy)+bx*(cy-ay)+cx*(ay-by));if(Math.abs(d)<1e-9)return null;const A2=ax*ax+ay*ay,B2=bx*bx+by*by,C2=cx*cx+cy*cy;const ux=(A2*(by-cy)+B2*(cy-ay)+C2*(ay-by))/d;const uy=(A2*(cx-bx)+B2*(ax-cx)+C2*(bx-ax))/d;return{center:{x:ux,y:uy},r:Math.hypot(ax-ux,ay-uy)};}
  function arcSamples(A,B,C,n){const cc=circumcircle(A,B,C);if(!cc)return null;const{center,r}=cc;const ang=p=>Math.atan2(p.y-center.y,p.x-center.x);const norm=x=>{while(x<0)x+=2*Math.PI;while(x>=2*Math.PI)x-=2*Math.PI;return x;};const a0=ang(A),a2=ang(C);const rel=norm(ang(B)-a0),full=norm(a2-a0);const ccw=rel<=full;const sweep=ccw?full:2*Math.PI-full;const pts=[];n=n||48;for(let i=0;i<=n;i++){const a=a0+(ccw?1:-1)*sweep*(i/n);pts.push({x:center.x+r*Math.cos(a),y:center.y+r*Math.sin(a)});}return{center,r,sweep,pts};}
  function polyArea(p){let s=0;for(let i=0;i<p.length;i++){const j=(i+1)%p.length;s+=p[i].x*p[j].y-p[j].x*p[i].y;}return Math.abs(s)/2;}
  function polyPerim(p,close){let s=0;for(let i=0;i<p.length-1;i++)s+=dist(p[i],p[i+1]);if(close&&p.length>2)s+=dist(p[p.length-1],p[0]);return s;}
  function centroid(p){let x=0,y=0;p.forEach(q=>{x+=q.x;y+=q.y;});return{x:x/p.length,y:y/p.length};}
  function catmull(pts,seg){if(pts.length<3)return pts.slice();const out=[];for(let i=0;i<pts.length-1;i++){const p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||pts[i+1];for(let j=0;j<seg;j++){const t=j/seg,t2=t*t,t3=t2*t;out.push({x:0.5*((2*p1.x)+(-p0.x+p2.x)*t+(2*p0.x-5*p1.x+4*p2.x-p3.x)*t2+(-p0.x+3*p1.x-3*p2.x+p3.x)*t3),y:0.5*((2*p1.y)+(-p0.y+p2.y)*t+(2*p0.y-5*p1.y+4*p2.y-p3.y)*t2+(-p0.y+3*p1.y-3*p2.y+p3.y)*t3)});}}out.push(pts[pts.length-1]);return out;}
  function ellipseInfo(p){const cx=(p[0].x+p[1].x)/2,cy=(p[0].y+p[1].y)/2,rx=Math.abs(p[1].x-p[0].x)/2,ry=Math.abs(p[1].y-p[0].y)/2;return{cx,cy,rx,ry};}
  function circleOf(m){if(m.type==="circle")return{center:m.pts[0],r:dist(m.pts[0],m.pts[1])};if(m.pts.length<3)return null;const cc=circumcircle(m.pts[0],m.pts[1],m.pts[2]);return cc?{center:cc.center,r:cc.r}:null;}

  // ---------- compute ----------
  function computeShape(m){
    const p=m.pts;
    try{
      switch(m.type){
        case "line":{const L=px2u(dist(p[0],p[1]));return{text:U(L,1),detail:"",kind:"length",value:L};}
        case "angle":{const a=angleDeg(p[0],p[1],p[2]);return{text:fmt(a)+"°",detail:"",kind:"angle",value:a};}
        case "parallel":{const d=px2u(pointLineDist(p[2],p[0],p[1]));return{text:U(d,1),detail:L("gapParallel"),kind:"length",value:d};}
        case "pointline":{const d=px2u(pointLineDist(p[2],p[0],p[1]));return{text:U(d,1),detail:L("ptToLine"),kind:"length",value:d};}
        case "arc":{const a=arcSamples(p[0],p[1],p[2],40);if(!a)return{text:"—",detail:L("collinear"),kind:"other"};const R=px2u(a.r),L2=px2u(a.r*a.sweep);return{text:"⌒ "+U(L2,1),detail:"R "+U(R,1)+" · "+fmt(a.sweep*180/Math.PI)+"°",kind:"length",value:L2};}

  // ---------- canvas ----------
  // CW/CH 是 CSS 像素下的画布尺寸；画布位图按其 × devicePixelRatio 分配，
  // 再用 setTransform 把坐标系还原成 CSS 像素，这样所有绘制逻辑无需改动即可获得 HiDPI 清晰度。
  let CW=0,CH=0,DPR=1;
  function currentDpr(){try{return Math.min(3,Math.max(1,window.devicePixelRatio||1));}catch(e){return 1;}}
  function resize(){
    const r=stage.getBoundingClientRect();
    CW=Math.max(1,Math.round(r.width));CH=Math.max(1,Math.round(r.height));DPR=currentDpr();
    canvas.width=Math.round(CW*DPR);canvas.height=Math.round(CH*DPR);
    canvas.style.width=CW+"px";canvas.style.height=CH+"px";
    ctx.setTransform(DPR,0,0,DPR,0,0); // 位图放大后，把 1 单位还原成 1 CSS px
    syncLoupeDpr(LOUPE_L);
    draw();
  }
  window.addEventListener("resize",resize);
  // 跨屏拖动 / 系统缩放变化会改变 devicePixelRatio，重配位图
  (function(){
    function handler(){resize();watch();}
    function watch(){
      try{
        if(watch.mq&&watch.mq.removeEventListener)watch.mq.removeEventListener("change",handler);
        watch.mq=window.matchMedia("(resolution: "+window.devicePixelRatio+"dppx)");
        if(watch.mq&&watch.mq.addEventListener)watch.mq.addEventListener("change",handler);
      }catch(e){}
    }
    watch();
  })();
  function fitView(){if(!S.img)return;const pad=40,w=CW-pad*2,h=CH-pad*2;const sc=Math.min(w/S.img.width,h/S.img.height);S.view.scale=sc>0?sc:1;S.view.ox=(CW-S.img.width*S.view.scale)/2;S.view.oy=(CH-S.img.height*S.view.scale)/2;draw();}

  function draw(){
    ctx.clearRect(0,0,CW,CH);
    if(!S.img)return;
    ctx.drawImage(S.img,S.view.ox,S.view.oy,S.img.width*S.view.scale,S.img.height*S.view.scale);
    paintOverlay(ctx,imgToScreen,{k:S.view.scale,cacheLbl:true,handles:true,hover:true});
  }
  // 覆盖层（所有测量/辅助元素的矢量绘制）。g 可以是主画布 ctx，也可以是放大镜 ctx；
  // T 是「图像坐标 → 目标坐标」的映射；这样放大镜无需采样位图就能重画出同样的内容。
  // ⚠️ 这里一度加了「按矩形裁剪视口外图形」的优化，已回退：性能收益未经验证，而正确性有坑——
  // 长直线/无限延伸的辅助线(aux)、超出顶点 15% 的点距线(pointline)都会穿过放大镜视口却因顶点在框外被误剔除。

  function paintOverlay(g,T,opt){
    const k=opt.k||1;

    S.measures.forEach(m=>{
      const bw=(m.lw||S.gLineW);
      renderShape(g,m,T,{k,lw:bw+(m.id===S.selId?0.8:0),fs:12,cacheLbl:opt.cacheLbl,
        handles:opt.handles&&(S.mode==="select"&&m.id===S.selId),
        // 悬停时临时亮出端点/边中点。若它此刻正在显示方形手柄（select 模式下的选中项），
        // 就不叠第二套标记；其余情况都显示——包含「绘图模式下悬停到已完成的图形」，
        // 那正是画新线时要对齐旧线端点/中点的时候。

        active:(m.id===S.selId?S.active:-1),sel:m.id===S.selId});
    });

      const pts=S.placing.pts.slice();

  }

  function roundRect(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}

  // generic renderer. T: image->screen; opt.k scale factor for radii/linewidth base

    else if(t==="circle3"){if(m.pts.length>=3){const cc=circumcircle(m.pts[0],m.pts[1],m.pts[2]);if(cc){const c=T(cc.center),rS=cc.r*k;g.beginPath();g.arc(c.x,c.y,rS,0,Math.PI*2);g.stroke();centerImg=cc.center;anchor={x:c.x,y:c.y-rS};}else{stroke(P,false);anchor=P[1];}}else{stroke(P,false);anchor=P[P.length-1];}}

  // ---------- hit testing ----------
  function handleAt(m,sp){for(let i=0;i<m.pts.length;i++){if(dist(imgToScreen(m.pts[i]),sp)<10)return i;}return -1;}

    const P=m.pts.map(imgToScreen),tol=7;
    const segs=(arr,close)=>{for(let i=0;i<arr.length-1;i++)if(pointSegDist(sp,arr[i],arr[i+1])<tol)return true;if(close&&arr.length>2&&pointSegDist(sp,arr[arr.length-1],arr[0])<tol)return true;return false;};

      case "line":return segs(P,false);
      case "angle":return segs(P,false);
      case "parallel":case "pointline":return segs([P[0],P[1]],false)||dist(P[2]||sp,sp)<12;
      case "arc":{const a=arcSamples(m.pts[0],m.pts[1],m.pts[2],40);return a?segs(a.pts.map(imgToScreen),false):segs(P,false);}
      case "circle":case "circle3":{const cir=circleOf(m);if(!cir)return false;const c=imgToScreen(cir.center),rS=cir.r*S.view.scale;return Math.abs(dist(sp,c)-rS)<tol;}

      case "rect":{const c=[{x:m.pts[0].x,y:m.pts[0].y},{x:m.pts[1].x,y:m.pts[0].y},{x:m.pts[1].x,y:m.pts[1].y},{x:m.pts[0].x,y:m.pts[1].y}].map(imgToScreen);return segs(c,true);}
      case "polygon":return segs(P,true);
      case "spline":return segs(catmull(m.pts,16).map(imgToScreen),false);
      case "aux":{if(m.pts.length<2)return false;return pointLineDist(sp,imgToScreen(m.pts[0]),imgToScreen(m.pts[1]))<tol;}
    }
    return false;
  }

  // ---------- 悬停提示点 ----------
  // 图形画完后不再留端点（保持画面整洁），但鼠标移到它上面时临时把「端点 + 每条边的中点」
  // 亮出来，方便看清这条测量在哪、把光标精确放到想抓的点上。只做展示，不改命中逻辑。
  function hoverAnchors(m){
    if(!m||!m.pts||!m.pts.length)return{ends:[],mids:[]};
    const ends=[];
    if(m.type==="rect"&&m.pts.length>=2)cornerPoints(m).forEach(p=>ends.push({x:p.x,y:p.y}));
    else m.pts.forEach(p=>ends.push({x:p.x,y:p.y}));
    const mids=[];
    segmentsOf(m).forEach(sg=>{const a=sg[0],b=sg[1];if(a&&b)mids.push({x:(a.x+b.x)/2,y:(a.y+b.y)/2});});
    return{ends,mids};
  }
  // 悬停命中：取最上层的那条（与点击选中的顺序一致）。
  // 拖动中不参与（手上已经有东西了）；但**放置中照样参与**——画第二个点的时候最需要看清
  // 已有图形的关键点在哪。
  function hoverAt(sp){
    if(S.drag)return null;
    for(let i=S.measures.length-1;i>=0;i--){if(hitBody(S.measures[i],sp))return S.measures[i].id;}
    return null;
  }

  // ---------- constraints ----------
  function CON(e){return (!!(e&&e.shiftKey))||S.constrain;}
  // 约束方向集合：默认仅平行(0/180)与垂直(90/270)，外加用户自定义角度(在四象限镜像)
  function constraintAngles(){
    const deg=new Set([0,90,180,270]);
    (S.customAngles||[]).forEach(a=>{if(a==null||a==="")return;const v=parseFloat(a);if(isNaN(v))return;let n=((v%180)+180)%180;[n,180-n,180+n,360-n].forEach(x=>deg.add((x%360+360)%360));});
    return [...deg].map(d=>d*Math.PI/180);
  }
  function constrain(prev,cur,type){
    if(!prev)return cur;
    if(type==="rect"||type==="ellipse"){const dx=cur.x-prev.x,dy=cur.y-prev.y,m=Math.max(Math.abs(dx),Math.abs(dy));return{x:prev.x+Math.sign(dx||1)*m,y:prev.y+Math.sign(dy||1)*m};}
    if(type==="circle"||type==="circle3")return cur;
    // 方向约束：吸附到平行/垂直 + 自定义角度
    const dx=cur.x-prev.x,dy=cur.y-prev.y;
    if(dx===0&&dy===0)return cur;
    const angs=constraintAngles();
    const ca=Math.atan2(dy,dx);
    let best=angs[0],bd=Infinity;
    for(const a of angs){let diff=Math.abs(ca-a)%(2*Math.PI);if(diff>Math.PI)diff=2*Math.PI-diff;if(diff<bd){bd=diff;best=a;}}
    const len=dx*Math.cos(best)+dy*Math.sin(best);
    return{x:prev.x+len*Math.cos(best),y:prev.y+len*Math.sin(best)};
  }

  // ---------- interaction ----------
  function mousePos(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};}

  canvas.addEventListener("mousedown",e=>{
    if(!S.img)return;const sp=mousePos(e);
    if(S.mode==="pan"||e.button===1){S.panning=true;S.panStart=sp;S.viewStart={ox:S.view.ox,oy:S.view.oy};canvas.style.cursor="grabbing";e.preventDefault();return;}
    if(e.button!==0)return;
    if(S.mode==="select"){selectDown(sp,e);return;}
    // placement modes (shape tools + calibrate)
    placementClick(sp,e);
  });

  canvas.addEventListener("mousemove",e=>{
    const sp=mousePos(e);S.mouseSp=sp;
    if(S.panning){S.view.ox=S.viewStart.ox+(sp.x-S.panStart.x);S.view.oy=S.viewStart.oy+(sp.y-S.panStart.y);draw();drawLoupe(sp);updateStatus(sp);return;}
    if(S.drag){dragMove(sp,e);drawLoupe(sp);return;}
    if(S.placing){updateExtSeg(sp);const ipRaw=screenToImg(sp);
      S.hoverId=hoverAt(sp);   // 正在画的时候也要亮出已有图形的关键点，方便对齐
      if(S.adjusting){const idx=S.placing.pts.length-1;const prev=idx>0?S.placing.pts[idx-1]:null;const r=placePoint(prev,ipRaw,S.placing.type,CON(e),sp);S.placing.pts[idx]=r.pt;S.cursorImg=r.pt;S.snapPt=r.snap;}
      else{const prev=S.placing.pts[S.placing.pts.length-1];const r=placePoint(prev,ipRaw,S.placing.type,CON(e),sp);S.cursorImg=r.pt;S.snapPt=r.snap;}
      draw();}
    else if(S.img&&(SHAPES[S.mode]||S.mode==="calibrate")){const beforeExt=extKey(S.extSegs);updateExtSeg(sp);const snap=snapVertex(sp);const snapChanged=(snap!==S.snapPt&&!(snap&&S.snapPt&&snap.x===S.snapPt.x&&snap.y===S.snapPt.y));S.snapPt=snap;const hv=hoverAt(sp);const hoverChanged=hv!==S.hoverId;S.hoverId=hv;if(snapChanged||hoverChanged||extKey(S.extSegs)!==beforeExt)draw();}
    else if(S.snapPt||(S.extSegs&&S.extSegs.length)){S.snapPt=null;S.extSegs=[];draw();}
    // select 模式在这里算悬停高亮；其它模式（平移等）则清掉悬停。
    // 注意：绘图 / 放置分支本轮已经算过 hoverId，绝不能在这里顺手清掉。
    if(S.mode==="select"&&!S.drag&&!S.placing){
      // 命中哪条就把它的端点/边中点临时亮出来。命中结果变了才重绘，
      // 否则每次 mousemove 都重画一遍白白烧 CPU。
      const h=hoverAt(sp);
      if(h!==S.hoverId){S.hoverId=h;draw();}
      const m=S.selId!=null?getM(S.selId):null;
      const onSel=!!(m&&(handleAt(m,sp)>=0||hitLabel(m,sp)||hitBody(m,sp)));
      canvas.style.cursor=(onSel||h!=null)?"move":"default";
    }else if(S.hoverId!=null&&!S.placing&&!(SHAPES[S.mode]||S.mode==="calibrate")){S.hoverId=null;draw();}
    drawLoupe(sp);updateStatus(sp);
  });
  window.addEventListener("mouseup",()=>{if(S.panning){S.panning=false;canvas.style.cursor=S.mode==="pan"?"grab":(S.mode==="select"?"default":"crosshair");}if(S.drag){const moved=S.dragMoved;S.drag=null;S.dragMoved=false;if(moved)commit();}if(S.adjusting)placementUp();});
  canvas.addEventListener("mouseleave",()=>{loupeEl.style.display="none";let need=false;if((S.snapPt||(S.extSegs&&S.extSegs.length))&&!S.placing){S.snapPt=null;S.extSegs=[];need=true;}if(S.hoverId!=null){S.hoverId=null;need=true;}if(need)draw();});
  canvas.addEventListener("contextmenu",e=>{if(S.placing){e.preventDefault();cancelPlacing();}});
  canvas.addEventListener("dblclick",e=>{if(S.placing&&(S.placing.type==="polygon"||S.placing.type==="spline")){popLastIfDuplicate(S.placing.pts);finalizePlacing();e.preventDefault();return;}if(S.mode==="select"&&S.img){const sp=mousePos(e);if(tryInsertVertex(sp))e.preventDefault();}});

  canvas.addEventListener("wheel",e=>{if(!S.img)return;e.preventDefault();const sp=mousePos(e);const ip=screenToImg(sp);const f=e.deltaY<0?1.12:1/1.12;S.view.scale=Math.min(80,Math.max(0.02,S.view.scale*f));S.view.ox=sp.x-ip.x*S.view.scale;S.view.oy=sp.y-ip.y*S.view.scale;draw();drawLoupe(sp);updateStatus(sp);},{passive:false});

  // 图形中心（封闭图形/圆弧）
  function shapeCenter(m){
    const p=m.pts;
    if(m.type==="circle")return p[0]||null;
    if(m.type==="circle3"||m.type==="arc"){if(p.length<3)return null;const cc=circumcircle(p[0],p[1],p[2]);return cc?cc.center:null;}
    if(m.type==="ellipse"){if(p.length<2)return null;const e=ellipseInfo(p);return{x:e.cx,y:e.cy};}
    if(m.type==="rect"){if(p.length<2)return null;return{x:(p[0].x+p[1].x)/2,y:(p[0].y+p[1].y)/2};}
    if(m.type==="polygon"){if(!p.length)return null;return centroid(p);}
    return null;
  }
  // 直线段（用于线段/延长线吸附）
  function segmentsOf(m){const p=m.pts;switch(m.type){
    case "line":case "parallel":case "pointline": return p.length>=2?[[p[0],p[1]]]:[];
    case "angle": {const s=[];if(p.length>=2)s.push([p[1],p[0]]);if(p.length>=3)s.push([p[1],p[2]]);return s;}
    case "rect": if(p.length>=2){const a=p[0],b=p[1],c1={x:b.x,y:a.y},c2={x:a.x,y:b.y};return[[a,c1],[c1,b],[b,c2],[c2,a]];} return [];
    case "polygon": {const s=[];for(let i=0;i<p.length;i++)s.push([p[i],p[(i+1)%p.length]]);return s;}
    default: return [];

  // 收集所有可吸附的直线段（测量图形 + 标尺 + 正在放置的已定点）
  function allSegments(){
    const segs=[];
    S.measures.forEach(m=>{
      if(m.type==="aux"){if(m.pts.length>=2){const P0=m.pts[0],P1=m.pts[1];const dx=P1.x-P0.x,dy=P1.y-P0.y,len=Math.hypot(dx,dy)||1,ux=dx/len,uy=dy/len,ext=20000;segs.push({A:{x:P0.x-ux*ext,y:P0.y-uy*ext},B:{x:P1.x+ux*ext,y:P1.y+uy*ext},aux:true});}return;}
      segmentsOf(m).forEach(([A,B])=>segs.push({A,B}));
    });
    if(S.calibLine)segs.push({A:S.calibLine.p1,B:S.calibLine.p2});
    if(S.placing&&S.placing.pts.length>=2){const ps=S.placing.pts;for(let i=0;i<ps.length-2;i++)segs.push({A:ps[i],B:ps[i+1]});}
    return segs;
  }
  function sameSeg(s,e){if(!e)return false;return (s.A.x===e.A.x&&s.A.y===e.A.y&&s.B.x===e.B.x&&s.B.y===e.B.y)||(s.A.x===e.B.x&&s.A.y===e.B.y&&s.B.x===e.A.x&&s.B.y===e.A.y);}
  function extKey(a){return (a||[]).map(e=>e.A.x+","+e.A.y+","+e.B.x+","+e.B.y).join(";");}
  function segLineDist(e,ip,sp){const A=e.A,B=e.B,dx=B.x-A.x,dy=B.y-A.y,l2=dx*dx+dy*dy||1e-9;const t=((ip.x-A.x)*dx+(ip.y-A.y)*dy)/l2;const foot={x:A.x+dx*t,y:A.y+dy*t};return{d:dist(imgToScreen(foot),sp),t};}
  // 决定要显示延长线的线段集合：光标落在线段“本体”上即激活它（顶点处可同时激活多条，
  // 例如矩形/多边形的角，会同时显示横向与纵向延长线）；之后只要光标仍靠近某条已激活直线
  // （≤8px），该延长线持续显示并可吸附，其余远离的自动消失。
  function updateExtSeg(sp){
    const ip=screenToImg(sp);const segs=allSegments();
    const near=[];
    segs.forEach(s=>{if(s.aux)return;const{d,t}=segLineDist(s,ip,sp);if(t>=0&&t<=1&&d<8)near.push(s);});
    const out=near.map(s=>({A:{x:s.A.x,y:s.A.y},B:{x:s.B.x,y:s.B.y}}));
    (S.extSegs||[]).forEach(e=>{if(segLineDist(e,ip,sp).d<8&&!out.some(o=>sameSeg(o,e)))out.push(e);});
    S.extSegs=out;
  }
  // 两线段交点
  function segSegIntersect(A,B,C,D){
    const rx=B.x-A.x,ry=B.y-A.y,sx=D.x-C.x,sy=D.y-C.y;const den=rx*sy-ry*sx;if(Math.abs(den)<1e-9)return null;
    const t=((C.x-A.x)*sy-(C.y-A.y)*sx)/den,u=((C.x-A.x)*ry-(C.y-A.y)*rx)/den;
    if(t>=0&&t<=1&&u>=0&&u<=1)return{x:A.x+rx*t,y:A.y+ry*t};return null;
  }
  function allIntersections(){const segs=allSegments(),out=[];for(let i=0;i<segs.length;i++)for(let j=i+1;j<segs.length;j++){const a=segs[i],b=segs[j];if(!a.A||!a.B||!b.A||!b.B)continue;const p=segSegIntersect(a.A,a.B,b.A,b.B);if(p)out.push(p);}return out;}
  // 沿约束方向的射线吸附：仅返回落在射线上的点，从而在吸附时仍保持平行/垂直约束
  // ---------- 吸附候选点 ----------
  // 矩形只存对角两点(pts[0]/pts[1])，另外两个角是派生的。若只拿 pts 当端点候选，光标靠近
  // 那两个派生角时"无点可吸"，反而被 4 条边的中点抢走 —— 表现就是放大镜里抓到的是边线中点
  // 而不是角点。这里把矩形四角显式补成端点候选，并给候选分优先级。
  function cornerPoints(m){
    if(!m||m.type!=="rect"||!m.pts||m.pts.length<2)return [];
    const a=m.pts[0],b=m.pts[1];
    return [{x:a.x,y:a.y},{x:b.x,y:a.y},{x:b.x,y:b.y},{x:a.x,y:b.y}];
  }
  // 排序权重 bias：越小越优先。端点/交点 0、中心 2、边中点 6 —— 距离相近时端点胜出，
  // 边中点只有明显更近（近 6px 以上）才会盖过端点，避免"想抓角却抓到边中间"。
  const BIAS={point:0,cross:0,center:2,mid:6};
  function featurePoints(withDerived){
    const out=[];
    const push=(q,kind)=>{if(q&&isFinite(q.x)&&isFinite(q.y))out.push({x:q.x,y:q.y,kind,bias:BIAS[kind]||0});};
    S.measures.forEach(m=>{
      m.pts.forEach(q=>push(q,"point"));
      cornerPoints(m).forEach(q=>push(q,"point"));
      push(shapeCenter(m),"center");
    });
    if(S.calibLine){push(S.calibLine.p1,"point");push(S.calibLine.p2,"point");}
    if(S.placing){const ps=S.placing.pts;for(let i=0;i<ps.length-1;i++)push(ps[i],"point");}
    if(withDerived!==false){
      // 线段中点吸附
      allSegments().forEach(s=>{if(s.A&&s.B)push({x:(s.A.x+s.B.x)/2,y:(s.A.y+s.B.y)/2},"mid");});
      // 两线交点吸附
      allIntersections().forEach(p=>push(p,"cross"));
    }
    return out;
  }
  function snapAlongRay(prev,ux,uy,sp){
    const us=[];
    const raySegU=(A,rx,ry)=>{const det=rx*uy-ux*ry;if(Math.abs(det)<1e-9)return null;const ax=A.x-prev.x,ay=A.y-prev.y;const u=(-ax*ry+rx*ay)/det;const t=(ux*ay-uy*ax)/det;if(t<-1e-6||t>1+1e-6)return null;return u;};
    allSegments().forEach(s=>{if(!s.A||!s.B)return;const u=raySegU(s.A,s.B.x-s.A.x,s.B.y-s.A.y);if(u!=null)us.push({u,bias:0,kind:"cross"});});
    featurePoints().forEach(f=>{const u=(f.x-prev.x)*ux+(f.y-prev.y)*uy;const foot={x:prev.x+ux*u,y:prev.y+uy*u};if(dist(imgToScreen(foot),imgToScreen(f))<9)us.push({u,bias:f.bias||0,kind:f.kind});});
    let best=null;
    us.forEach(it=>{const pt={x:prev.x+ux*it.u,y:prev.y+uy*it.u};const d=dist(imgToScreen(pt),sp)+it.bias;if(d<11&&(!best||d<best.d))best={d,pt,kind:it.kind};});
    return best?{x:best.pt.x,y:best.pt.y,kind:best.kind}:null;
  }
  // 约束开启时的吸附：候选点先各自过一遍约束（矩形/椭圆→正方形、其它→约束角度），
  // 再挑离光标最近的一个。这样"抓端点"依然满足约束 —— 不会为了吸附把正方形拉成长方形。
  function snapConstrained(prev,type,sp){
    let best=null;
    featurePoints().forEach(f=>{
      const cp=constrain(prev,f,type);
      const d=dist(imgToScreen(cp),sp)+(f.bias||0);
      if(d<11&&(!best||d<best.d))best={d,pt:cp,kind:f.kind};
    });
    return best?{x:best.pt.x,y:best.pt.y,kind:best.kind}:null;
  }
  // 统一放置点解析：约束开启时保持约束方向（并沿约束射线吸附），否则正常吸附
  function placePoint(prev,ipRaw,type,conOn,sp){
    const snap=snapVertex(sp);
    if(conOn&&prev){
      if(type==="rect"||type==="ellipse"){
        const q=snapConstrained(prev,type,sp);
        if(q)return{pt:{x:q.x,y:q.y},snap:q};
        return{pt:constrain(prev,ipRaw,type),snap:null};
      }
      // 圆类本身不受方向约束影响，约束开启时一样走普通吸附（否则开了约束就莫名抓不到端点）
      if(type==="circle"||type==="circle3")return{pt:snap||ipRaw,snap:snap||null};
      const c=constrain(prev,ipRaw,type);
      const dx=c.x-prev.x,dy=c.y-prev.y,len=Math.hypot(dx,dy);
      if(len>1e-6){const ux=dx/len,uy=dy/len;const rp=snapAlongRay(prev,ux,uy,sp);if(rp)return{pt:{x:rp.x,y:rp.y},snap:{x:rp.x,y:rp.y,kind:rp.kind||"cross"}};}
      return{pt:c,snap:null};
    }
    return{pt:snap||ipRaw,snap:snap||null};
  }
  // 吸附：优先端点/中心（精确点），其次线段本体的垂足；延长线仅在已显示（S.extSegs）时可吸附
  function snapVertex(sp){
    const pth=11, lth=8; let best=null;
    const consider=(q)=>{if(!q)return;const d=dist(imgToScreen(q),sp)+(q.bias||0);if(d<pth&&(!best||d<best.d))best={d,pt:q,kind:q.kind};};
    featurePoints().forEach(consider);
    if(best)return{x:best.pt.x,y:best.pt.y,kind:best.kind};
    // 线段本体 / 延长线：吸到直线的垂足
    let bestL=null;const ipRaw=screenToImg(sp);
    const considerSeg=(A,B,allowExt)=>{if(!A||!B)return;const dx=B.x-A.x,dy=B.y-A.y,l2=dx*dx+dy*dy;if(l2<1e-9)return;
      const t=((ipRaw.x-A.x)*dx+(ipRaw.y-A.y)*dy)/l2;const onBody=t>=0&&t<=1;
      if(!onBody&&!allowExt)return;

      if(d<lth&&(!bestL||d<bestL.d))bestL={d,pt:foot};};
    allSegments().forEach(s=>considerSeg(s.A,s.B,s.aux||(S.extSegs||[]).some(e=>sameSeg(s,e))));
    if(bestL)return{x:bestL.pt.x,y:bestL.pt.y,kind:"line"};
    return null;
  }
  function placementClick(sp,e){
    const snap=snapVertex(sp);
    const ipRaw=screenToImg(sp);
    if(!S.placing){S.placing={type:S.mode,pts:[snap||ipRaw]};S.adjusting=true;S.cursorImg=snap||ipRaw;S.snapPt=snap;updatePlaceBar();draw();return;}
    // polygon close by clicking near start
    if(S.placing.type==="polygon"&&S.placing.pts.length>=3&&dist(imgToScreen(S.placing.pts[0]),sp)<10){finalizePlacing();return;}
    const prev=S.placing.pts[S.placing.pts.length-1];
    const r=placePoint(prev,ipRaw,S.placing.type,CON(e),sp);const np=r.pt;
    S.placing.pts.push(np);S.adjusting=true;S.cursorImg=np;S.snapPt=r.snap;updatePlaceBar();draw();
  }
  // 松开鼠标：确定当前正在放置的点，必要时完成图形
  function placementUp(){
    if(!S.placing||!S.adjusting)return;
    S.adjusting=false;
    const type=S.placing.type;
    const need=SHAPES[type]?SHAPES[type].click:2;
    if(type==="calibrate"){if(S.placing.pts.length>=2){S.pendingCalib={p1:S.placing.pts[0],p2:S.placing.pts[1]};S.placing=null;S.cursorImg=null;S.snapPt=null;openDlg();draw();return;}}
    else if(need>0&&S.placing.pts.length>=need){finalizePlacing();return;}
    draw();
  }
  function finalizePlacing(){
    if(!S.placing)return;const{type,pts}=S.placing;
    const need=SHAPES[type].click;
    if((type==="polygon"&&pts.length<3)||(type==="spline"&&pts.length<2)||(need>0&&pts.length<need)){cancelPlacing();return;}
    S.counters[type]=(S.counters[type]||0)+1;
    // 落笔即固化当前全局颜色/线宽：之后改全局样式不会回头改变已经画好的线。
    // 想要某条重新跟随全局，用列表里那一项的「↺ 全局」按钮（会把 color/lw 置回 null）。
    const m={id:S.nextId++,type,label:shapeName(type)+S.counters[type],color:S.gColor,lw:S.gLineW,dash:null,labelOff:null,pts:pts.map(p=>({x:p.x,y:p.y}))};
    S.measures.push(m);S.selId=m.id;S.active=-1;S.placing=null;S.adjusting=false;S.cursorImg=null;S.snapPt=null;S.extSegs=[];
    updatePlaceBar();renderList();draw();commit();
    if(!S.pxPerUnit&&m.type!=="aux"&&computeShape(m).kind!=="angle")toast(L("toastNoScale"));
  }
  function cancelPlacing(){S.placing=null;S.adjusting=false;S.cursorImg=null;S.snapPt=null;S.extSegs=[];updatePlaceBar();draw();}
  // 双击/双击闭合图形时，最后一点往往是"为了收尾"才点的，落在前一点附近，需要剔除。
  // 比较必须在【屏幕像素】下进行：双击判定用的是屏幕像素，若拿图像像素比（旧代码 <2），
  // 缩小视图时 2 图像 px 远小于判定阈值 24 屏幕 px，去重就会失效，多边形会多出一个退化顶点。
  const DUP_TAP_PX=24;
  function popLastIfDuplicate(pts){
    if(!pts||pts.length<2)return false;
    const a=imgToScreen(pts[pts.length-1]),b=imgToScreen(pts[pts.length-2]);
    if(dist(a,b)<DUP_TAP_PX){pts.pop();return true;}
    return false;
  }

  // ---------- undo / redo history ----------
  let _hist=[], _hi=-1; const HIST_MAX=200;
  function _snap(){return JSON.stringify({m:S.measures,cl:S.calibLine,pu:S.pxPerUnit,un:S.unit,ct:S.counters,ni:S.nextId,lk:S.scaleLocked});}
  function _restore(s){const d=JSON.parse(s);S.measures=d.m;S.calibLine=d.cl;S.pxPerUnit=d.pu;S.unit=d.un;S.counters=d.ct||{};S.nextId=d.ni||1;S.scaleLocked=!!d.lk;S.selId=null;S.active=-1;S.placing=null;S.cursorImg=null;S.snapPt=null;S.extSegs=[];S.hoverId=null;updateScaleUI();renderList();draw();}
  function histReset(){_hist=[_snap()];_hi=0;updateUndoUI();}
  function commit(){_hist=_hist.slice(0,_hi+1);_hist.push(_snap());_hi=_hist.length-1;if(_hist.length>HIST_MAX){_hist.shift();_hi--;}updateUndoUI();}
  function undo(){if(_hi<=0)return;_hi--;_restore(_hist[_hi]);updateUndoUI();}
  function redo(){if(_hi>=_hist.length-1)return;_hi++;_restore(_hist[_hi]);updateUndoUI();}
  function updateUndoUI(){const u=$("btnUndo"),r=$("btnRedo");if(u)u.disabled=_hi<=0;if(r)r.disabled=_hi>=_hist.length-1;}

  // ---- select / drag / nudge ----
  function getM(id){return S.measures.find(m=>m.id===id);}
  function selectDown(sp,e){
    if(S.selId!=null){const m=getM(S.selId);if(m){const v=handleAt(m,sp);if(v>=0){S.active=v;S.drag={kind:"handle",mid:m.id,vtx:v,startSp:sp,orig:m.pts.map(p=>({...p}))};return;}if(hitLabel(m,sp)){S.drag={kind:"label",mid:m.id,startSp:sp,origOff:{...(m.labelOff||{x:0,y:0})}};return;}}}
    for(let i=S.measures.length-1;i>=0;i--){const m=S.measures[i];const v=handleAt(m,sp);if(v>=0){S.selId=m.id;S.active=v;S.drag={kind:"handle",mid:m.id,vtx:v,startSp:sp,orig:m.pts.map(p=>({...p}))};renderList();draw();return;}if(hitLabel(m,sp)){S.selId=m.id;S.active=-1;S.drag={kind:"label",mid:m.id,startSp:sp,origOff:{...(m.labelOff||{x:0,y:0})}};renderList();draw();return;}if(hitBody(m,sp)){S.selId=m.id;S.active=-1;S.drag={kind:"shape",mid:m.id,startSp:sp,orig:m.pts.map(p=>({...p}))};renderList();draw();return;}}
    S.selId=null;S.active=-1;renderList();draw();
  }
  function dragMove(sp,e){
    const m=getM(S.drag.mid);if(!m)return;
    S.dragMoved=true;
    const dx=(sp.x-S.drag.startSp.x)/S.view.scale,dy=(sp.y-S.drag.startSp.y)/S.view.scale;
    if(S.drag.kind==="label"){m.labelOff={x:S.drag.origOff.x+dx,y:S.drag.origOff.y+dy};draw();return;}
    if(S.drag.kind==="handle"){let np={x:S.drag.orig[S.drag.vtx].x+dx,y:S.drag.orig[S.drag.vtx].y+dy};if(CON(e)&&m.pts.length===2){const other=S.drag.orig[1-S.drag.vtx];np=constrain(other,np,m.type);}m.pts[S.drag.vtx]=np;}
    else{m.pts=S.drag.orig.map(p=>({x:p.x+dx,y:p.y+dy}));}
    renderList();draw();
  }
  // 微调选中图形/顶点（键盘方向键 + 悬浮方向键共用）
  // 入参 dx/dy 是【屏幕像素】：内部换算成图像像素。否则缩小时（scale<1）一次 1px
  // 在屏幕上不足 1 个物理像素，按上去像失灵；放大时又会跨好几个像素。
  function nudge(dx,dy){
    if(S.selId==null)return;const m=getM(S.selId);if(!m)return;
    const s=1/(S.view.scale||1);
    if(S.active>=0){m.pts[S.active].x+=dx*s;m.pts[S.active].y+=dy*s;}
    else{m.pts.forEach(p=>{p.x+=dx*s;p.y+=dy*s;});}
    S.nudged=true;renderList();draw();
    if(S.loupe){const fp=(S.active>=0)?imgToScreen(m.pts[S.active]):imgToScreen(centroid(m.pts));drawLoupe(fp);}
  }

  // insert / delete vertices for polygon & spline
  function footSeg(P,A,B){const dx=B.x-A.x,dy=B.y-A.y,l2=dx*dx+dy*dy||1e-9;let t=((P.x-A.x)*dx+(P.y-A.y)*dy)/l2;t=Math.max(0,Math.min(1,t));return{x:A.x+dx*t,y:A.y+dy*t};}
  function nearestEdge(m,sp){const P=m.pts.map(imgToScreen);let best=null;const consider=(a,b,insIdx)=>{const d=pointSegDist(sp,P[a],P[b]);if(d<12&&(!best||d<best.d)){best={d,index:insIdx,pt:screenToImg(footSeg(sp,P[a],P[b]))};}};if(m.type==="polygon"){for(let i=0;i<P.length;i++)consider(i,(i+1)%P.length,i+1);}else{for(let i=0;i<P.length-1;i++)consider(i,i+1,i+1);}return best;}
  function tryInsertVertex(sp){const cands=[];if(S.selId!=null){const s=getM(S.selId);if(s)cands.push(s);}for(let i=S.measures.length-1;i>=0;i--){if(!cands.includes(S.measures[i]))cands.push(S.measures[i]);}for(const m of cands){if(!m||(m.type!=="polygon"&&m.type!=="spline"))continue;const ins=nearestEdge(m,sp);if(ins){m.pts.splice(ins.index,0,ins.pt);S.selId=m.id;S.active=ins.index;renderList();draw();commit();toast(L("toastVertexAdded"));return true;}}return false;}

  window.addEventListener("keydown",e=>{
    if((e.ctrlKey||e.metaKey)&&!e.altKey){const k=e.key.toLowerCase();if(k==="z"&&!e.shiftKey){undo();e.preventDefault();return;}if(k==="y"||(k==="z"&&e.shiftKey)){redo();e.preventDefault();return;}}
    if(document.activeElement&&document.activeElement.tagName==="INPUT")return;
    if(e.key==="Escape"){if($("helpMask").classList.contains("on")){closeHelp();return;}if(S.placing)cancelPlacing();return;}
    if((e.key==="Enter")&&S.placing){finalizePlacing();return;}
    if((e.key==="Delete"||e.key==="Backspace")&&S.selId!=null){const m=getM(S.selId);if(m&&S.active>=0&&(m.type==="polygon"||m.type==="spline")){const min=m.type==="polygon"?3:2;if(m.pts.length>min){m.pts.splice(S.active,1);S.active=-1;renderList();draw();commit();e.preventDefault();return;}}delMeasure(S.selId);e.preventDefault();return;}
    if(S.selId!=null&&e.key.startsWith("Arrow")){const step=CON(e)?10:1;const d={ArrowLeft:[-step,0],ArrowRight:[step,0],ArrowUp:[0,-step],ArrowDown:[0,step]}[e.key];if(!d)return;nudge(d[0],d[1]);e.preventDefault();}
  });
  window.addEventListener("keyup",e=>{if(e.key&&e.key.startsWith("Arrow")&&S.nudged){S.nudged=false;commit();}});

  function updateStatus(sp){const sb=$("statusbar");if(!S.img){sb.style.display="none";return;}sb.style.display="block";const ip=sp?screenToImg(sp):{x:0,y:0};let s=L("zoom")+` <span class="k">${Math.round(S.view.scale*100)}%</span>`;if(sp)s+=`　·　`+L("pixel")+` <span class="k">${Math.round(ip.x)}, ${Math.round(ip.y)}</span>`;sb.innerHTML=s;}

  // ---------- loupe ----------
  // 放大镜位图同样按 DPR 放大，否则放大镜自己在高分屏上也是糊的
  const LOUPE_BASE=152, LOUPE_TOUCH=180; // 手指比鼠标粗，触屏给更大的窗口
  let LOUPE_L=LOUPE_BASE;
  function syncLoupeDpr(L){
    const w=Math.round((L||LOUPE_BASE)*DPR);
    if(loupeEl.width!==w){loupeEl.width=w;loupeEl.height=w;}
  }
  // touch=true 时把放大镜挪到触点【上方】：手指和手掌会挡住右下方，鼠标则不会。
  function drawLoupe(sp,touch){
    if(!S.loupe||!S.img||!sp){loupeEl.style.display="none";return;}
    loupeEl.style.display="block";
    const L=touch?LOUPE_TOUCH:LOUPE_BASE,M=4.5,r=stage.getBoundingClientRect();
    LOUPE_L=L;
    loupeEl.style.width=L+"px";loupeEl.style.height=L+"px";
    let lx,ly;
    if(touch){
      lx=sp.x-L/2; ly=sp.y-26-L;                                  // 手指正上方
      if(ly<4)ly=sp.y+26;                                          // 上方放不下才退到下方
      lx=Math.max(4,Math.min(r.width-L-4,lx));
      ly=Math.max(4,Math.min(r.height-L-4,ly));
    }else{
      lx=sp.x+22; ly=sp.y+22;
      if(lx+L>r.width)lx=sp.x-22-L;
      if(ly+L>r.height)ly=sp.y-22-L;
    }
    loupeEl.style.left=lx+"px";loupeEl.style.top=ly+"px";
    syncLoupeDpr(L);
    const lg=loupeEl.getContext("2d");
    lg.setTransform(DPR,0,0,DPR,0,0); // 之后一律用 CSS 像素坐标作画
    lg.clearRect(0,0,L,L);
    lg.save();
    lg.beginPath();lg.arc(L/2,L/2,L/2-2,0,7);lg.clip();
    lg.fillStyle="#111";lg.fillRect(0,0,L,L);
    // 关键：这里不再截图主画布再拉伸（那样线条会变成马赛克），
    // 而是套一层「以光标为中心放大 M 倍」的变换，用同一套绘制命令重画一遍。
    // 矢量图元(lineTo/stroke/text)在 CTM 下会被重新光栅化，所以放大后依然锐利。
    lg.translate(L/2,L/2);lg.scale(M,M);lg.translate(-sp.x,-sp.y);
    lg.imageSmoothingEnabled=(S.view.scale*M<1); // 放大时保留清晰像素边界，缩小时才开启插值
    try{lg.drawImage(S.img,S.view.ox,S.view.oy,S.img.width*S.view.scale,S.img.height*S.view.scale);}catch(_){}
    lg.imageSmoothingEnabled=true;
    paintOverlay(lg,imgToScreen,{k:S.view.scale,handles:true,hover:true});
    lg.restore();
    lg.setTransform(DPR,0,0,DPR,0,0);
    lg.strokeStyle="rgba(255,80,90,.95)";lg.lineWidth=1;lg.beginPath();lg.moveTo(L/2,L/2-11);lg.lineTo(L/2,L/2+11);lg.moveTo(L/2-11,L/2);lg.lineTo(L/2+11,L/2);lg.stroke();
    lg.strokeStyle="rgba(255,255,255,.3)";lg.beginPath();lg.arc(L/2,L/2,6,0,7);lg.stroke();
    // 真实落点标记：约束（正方形/角度）或吸附会让"真正落下去的点"和手指/光标错开，
    // 而放大镜中心画的是手指位置。两者差得远时额外标出落点，免得看着像抓在边线中间。
    if(S.placing&&S.cursorImg){
      const cp=imgToScreen(S.cursorImg);
      const px=(cp.x-sp.x)*M+L/2, py=(cp.y-sp.y)*M+L/2;
      if(Math.hypot(px-L/2,py-L/2)>3&&px>6&&px<L-6&&py>6&&py<L-6){
        lg.fillStyle="rgba(76,154,255,.95)";lg.fillRect(px-3,py-3,6,6);
        lg.strokeStyle="rgba(255,255,255,.9)";lg.lineWidth=1;lg.strokeRect(px-3.5,py-3.5,7,7);
      }
    }
  }

  // ---------- list ----------
  function renderList(){
    const wrap=$("mlist");wrap.innerHTML="";$("mcount").textContent=S.measures.length;$("btnDel").disabled=S.selId==null;
    updateFloatUI();
    if(!S.measures.length){wrap.innerHTML='<div class="empty">'+L("emptyList")+'</div>';$("totalLen").textContent="—";return;}
    let total=0,any=false;
    S.measures.forEach(m=>{
      const c=computeShape(m);if(c.kind==="length"&&c.value!=null){total+=c.value;any=true;}
      const effColor=m.color||S.gColor, effW=m.lw||S.gLineW, custom=(m.color!=null||m.lw!=null);
      const el=document.createElement("div");el.className="mitem"+(m.id===S.selId?" sel":"");el.dataset.mid=m.id;
      el.innerHTML=`<div class="top"><div class="name"><span class="swatch" style="background:${effColor}"></span>
        <input class="lbl" value="${esc(m.label)}"></div><span class="badge">${esc(shapeName(m.type))}</span>
        <button class="del" title="${esc(L("delete"))}">✕</button></div>
        <div class="top"><span class="det">${esc(c.detail||"")}</span><span class="len">${esc(c.text)}</span></div>
        <div class="style"><input type="color" class="mcolor" value="${effColor}" title="${esc(L("thisColor"))}">
        <input type="range" class="mw" min="0.5" max="12" step="0.1" value="${fmt(effW)}" title="${esc(L("thisWidth"))}"><input type="number" class="mwbox" min="0.5" max="12" step="0.1" value="${fmt(effW)}" title="${esc(L("thisWidth"))}"><span class="cap">px</span>
        <button class="rst" title="${esc(L("resetGlobalTitle"))}" ${custom?"":"disabled"}>${esc(L("globalBtn"))}</button></div>${m.type==="aux"?`
        <div class="style dashrow"><span class="cap dashlbl">${esc(L("dashGap"))}</span><input type="range" class="dashr" min="1" max="24" step="1" value="${m.dash!=null?m.dash:5}" title="${esc(L("dashGap"))}"><span class="cap dashval">${m.dash!=null?m.dash:5}</span></div>`:""}`;
      el.addEventListener("click",ev=>{if(ev.target.classList.contains("lbl")||ev.target.classList.contains("del"))return;S.selId=m.id;S.active=-1;if(S.mode!=="select")setMode("select");renderList();draw();});
      const inp=el.querySelector(".lbl");inp.addEventListener("input",()=>{m.label=inp.value;draw();});inp.addEventListener("change",commit);inp.addEventListener("click",ev=>ev.stopPropagation());
      const cin=el.querySelector(".mcolor");cin.addEventListener("input",()=>{m.color=cin.value;el.querySelector(".swatch").style.background=cin.value;el.querySelector(".rst").disabled=false;draw();});cin.addEventListener("change",commit);cin.addEventListener("click",ev=>ev.stopPropagation());
      const win=el.querySelector(".mw");const wb=el.querySelector(".mwbox");
      const setW=v=>{if(!(v>0))return;v=Math.min(12,Math.max(0.5,v));m.lw=v;el.querySelector(".rst").disabled=false;draw();};
      win.addEventListener("input",()=>{setW(parseFloat(win.value));wb.value=fmt(m.lw);});win.addEventListener("change",commit);win.addEventListener("click",ev=>ev.stopPropagation());
      wb.addEventListener("input",()=>{const v=parseFloat(wb.value);if(isNaN(v))return;setW(v);win.value=m.lw;});wb.addEventListener("change",()=>{let v=parseFloat(wb.value);if(isNaN(v)||v<=0)v=m.lw||S.gLineW;setW(v);win.value=m.lw;wb.value=fmt(m.lw);commit();});wb.addEventListener("click",ev=>ev.stopPropagation());
      el.querySelector(".rst").addEventListener("click",ev=>{ev.stopPropagation();m.color=null;m.lw=null;renderList();draw();commit();});
      if(m.type==="aux"){const dr=el.querySelector(".dashr");dr.addEventListener("input",()=>{m.dash=parseInt(dr.value,10);el.querySelector(".dashval").textContent=dr.value;draw();});dr.addEventListener("change",commit);dr.addEventListener("click",ev=>ev.stopPropagation());}
      el.querySelector(".del").addEventListener("click",ev=>{ev.stopPropagation();delMeasure(m.id);});
      wrap.appendChild(el);
    });
    $("totalLen").textContent=any?fmt(total)+S.unit:"—";
  }
  function esc(s){return(s+"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
  function delMeasure(id){S.measures=S.measures.filter(m=>m.id!==id);if(S.selId===id){S.selId=null;S.active=-1;}if(S.hoverId===id)S.hoverId=null;renderList();draw();commit();}

  function updateScaleUI(){if(S.pxPerUnit){$("scaleVal").textContent=fmt(S.pxPerUnit)+" px / "+S.unit;$("scaleVal").className="val";$("scaleRow2").style.display="flex";$("scaleUnit").textContent=fmt(1/S.pxPerUnit)+" "+S.unit;}else{$("scaleVal").textContent=L("notCalibratedShort");$("scaleVal").className="val noscale";$("scaleRow2").style.display="none";}updateLockUI();}
  function updateLockUI(){
    const row=$("lockRow"),btn=$("btnScaleLock");if(!row||!btn)return;

  }

  // ---------- modes ----------
  function setMode(m){
    if(m==="calibrate"&&S.scaleLocked){toast(L("toastScaleLocked"));return;}
    if(S.placing)cancelPlacing();
    S.mode=m;S.snapPt=null;S.extSegs=[];S.hoverId=null;
    if(m==="calibrate"&&!S.loupe){S.loupe=true;$("btnLoupe").classList.add("active");if(S.mouseSp)drawLoupe(S.mouseSp);}
    document.querySelectorAll("[data-mode]").forEach(b=>b.classList.toggle("active",b.dataset.mode===m));

    else if(m==="calibrate"){th.style.display="block";th.innerHTML=`<b>${esc(L("setScale"))}</b>　${esc(L("hintCalib"))}`;}
    else if(m==="select"){th.style.display="block";th.innerHTML=`<b>${esc(L("toolSelectName"))}</b>　${esc(L("hintSelect"))}`;}
    else th.style.display="none";
    draw();
  }
  document.querySelectorAll("[data-mode]").forEach(b=>b.addEventListener("click",()=>{if(!S.img&&b.dataset.mode!=="select"){toast(L("toastNeedImg"));return;}setMode(b.dataset.mode);}));
  $("btnLoupe").addEventListener("click",()=>{S.loupe=!S.loupe;$("btnLoupe").classList.toggle("active",S.loupe);if(!S.loupe)loupeEl.style.display="none";else if(S.mouseSp)drawLoupe(S.mouseSp);});
  $("btnRadius").addEventListener("click",()=>{S.showRadius=!S.showRadius;$("btnRadius").classList.toggle("active",S.showRadius);draw();});
  function closeMenus(){document.querySelectorAll(".menuwrap.open").forEach(w=>w.classList.remove("open"));}

  // 常用标准色板：点一下即设为全局颜色
  function buildSwatches(){

  function markSwatches(){

  // 导出测量清单为 CSV（带 BOM，Excel 直接打开不乱码）
  function exportCsv(){
    const cell=s=>{const v=(""+(s==null?"":s));return /[",\r\n\t]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
    const rows=[[L("csvLabel"),L("csvType"),L("csvValue"),L("csvDetail")]];
    let total=0,any=false;
    S.measures.forEach(m=>{
      const c=computeShape(m);
      if(c.kind==="length"&&c.value!=null){total+=c.value;any=true;}
      rows.push([m.label||"",shapeName(m.type),c.text||"",c.detail||""]);
    });
    if(any)rows.push([L("totalLabel"),"",fmt(total)+" "+S.unit,""]);
    rows.push([L("csvScale"),"",S.pxPerUnit?fmt(S.pxPerUnit)+" px / "+S.unit:L("notCalibratedShort"),""]);
    const csv="\uFEFF"+rows.map(r=>r.map(cell).join(",")).join("\r\n");
    const blob=new Blob([csv],{type:"text/csv;charset=utf-8"});
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);
    a.download=((S.imgName||"").replace(/\.[^.]+$/,"")||"measure")+"_measurements.csv";

  function renderAnnotated(scale){const w=Math.round(S.img.width*scale),h=Math.round(S.img.height*scale);const oc=document.createElement("canvas");oc.width=w;oc.height=h;const g=oc.getContext("2d");g.drawImage(S.img,0,0,w,h);const T=p=>({x:p.x*scale,y:p.y*scale});const lw=Math.max(2,2.4*scale),fs=Math.max(12,13*scale);if(S.calibLine)renderShape(g,{type:"line",pts:[S.calibLine.p1,S.calibLine.p2],color:"#e0a800"},T,{k:scale,lw,fs,dash:true,forceText:calibText()});S.measures.forEach(m=>renderShape(g,m,T,{k:scale,lw:Math.max(1,(m.lw||S.gLineW)*scale),fs}));return oc;}

  // 把测量线条/标注以矢量方式画到 PDF 上：用一个模拟 Canvas 2D 的适配器复用 renderShape 的全部绘制逻辑，
  // 每个绘制调用转成 jsPDF 的矢量图元。照片仍是位图，线条与文字则是可无损缩放的矢量。
  function drawVectorOverlay(pdf,ix,iy,iw,ih,sc){
    const canvasW=S.img.width*sc; const f=iw/canvasW; // canvas像素 -> mm
    const vc=makePdfCtx(pdf,f,ix,iy);
    const T=p=>({x:p.x*sc,y:p.y*sc});

  // Canvas2D -> jsPDF 矢量适配器。renderShape 传入的坐标/长度都以 canvas 像素为单位，f 把它们换算为 mm。
  function makePdfCtx(pdf,f,ox,oy){

    function parseColor(c){

      if(c[0]==="#"){let h=c.slice(1);if(h.length===3)h=h.split("").map(x=>x+x).join("");const n=parseInt(h,16);return[(n>>16)&255,(n>>8)&255,n&255,1];}
      const m=c.match(/rgba?\(([^)]+)\)/i);if(m){const p=m[1].split(",").map(s=>parseFloat(s));return[p[0]|0,p[1]|0,p[2]|0,(p[3]==null||isNaN(p[3]))?1:p[3]];}

      get globalAlpha(){return st.globalAlpha;}, set globalAlpha(v){st.globalAlpha=v;},
      get lineCap(){return st.lineCap;}, set lineCap(v){st.lineCap=v;},
      get lineJoin(){return st.lineJoin;}, set lineJoin(v){st.lineJoin=v;},
      get textBaseline(){return st.textBaseline;}, set textBaseline(v){st.textBaseline=v;},

      setLineDash(a){st.dash=(a&&a.length)?a.slice():[];},
      beginPath(){paths=[];},
      moveTo(x,y){paths.push({pts:[{x,y}],closed:false});},
      lineTo(x,y){if(!paths.length)paths.push({pts:[{x,y}],closed:false});else paths[paths.length-1].pts.push({x,y});},
      closePath(){if(paths.length)paths[paths.length-1].closed=true;},
      arc(cx,cy,r,a0,a1,ccw){appendArc(arcPts(cx,cy,r,r,a0,a1,ccw));},
      ellipse(cx,cy,rx,ry,rot,a0,a1,ccw){appendArc(arcPts(cx,cy,rx,ry,a0,a1,ccw));},
      arcTo(x1,y1,x2,y2,r){ctx.lineTo(x1,y1);},
      stroke(){applyStroke();paths.forEach(p=>{if(p.pts.length<2)return;const{start,d}=deltas(p.pts);pdf.lines(d,start.x,start.y,[1,1],"S",p.closed);});},
      fill(){applyFill();paths.forEach(p=>{if(p.pts.length<2)return;const{start,d}=deltas(p.pts);pdf.lines(d,start.x,start.y,[1,1],"F",true);});},
      strokeRect(x,y,w,h){applyStroke();pdf.rect(toX(x),toY(y),toL(w),toL(h),"S");},
      fillRect(x,y,w,h){applyFill();pdf.rect(toX(x),toY(y),toL(w),toL(h),"F");},

      fillText(t,x,y){t=""+t;const c=parseColor(st.fillStyle);
        if(hasCJK(t)&&mcv){const R=4,px=st.fs*R;mcv.font=fontCss(px);const wpx=Math.max(1,mcv.measureText(t).width),hpx=Math.ceil(px*1.35);

  // PDF 中输出可能含中文的文本：纯拉丁走矢量文字，含非拉丁字符则渲染为高清位图贴入（ptSize 为磅值，rgb 可选）
  function cjkText(pdf,txt,x,y,ptSize,rgb){
    txt=""+txt;let cjk=false;for(let i=0;i<txt.length;i++)if(txt.charCodeAt(i)>255){cjk=true;break;}
