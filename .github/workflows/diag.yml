# 诊断流水线（仅 ubuntu，单 job）：把 cargo check / tauri build 的真实报错
# 用 ::error:: 注解打出来（匿名 API 可读），用于定位桌面构建失败。
# 构建恢复健康后可删除此文件。
name: "Diag Build (ubuntu)"

on:
  workflow_dispatch:
  push:
    branches:
      - desktop-ci

jobs:
  diag:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Tauri CLI
        run: npm install
        working-directory: desktop

      - name: Generate icon set
        run: npx tauri icon src-tauri/icons/app-icon.png
        working-directory: desktop

      - name: cargo check (errors to annotations)
        continue-on-error: true
        run: |
          set +e
          cd desktop/src-tauri
          OUT=$(cargo check --message-format short 2>&1); CODE=$?
          printf '%s\n' "$OUT" | tail -60
          MSG=$(printf '%s' "$OUT" | grep -iE '^error|error\[|failed|cannot find|unresolved' | tail -12 | tr '\n' ' ; ' | cut -c1-900)
          echo "::error::cargo check exit=$CODE :: $MSG"
          cd ..

      - name: tauri build --no-bundle (errors to annotations)
        continue-on-error: true
        run: |
          set +e
          cd desktop
          OUT=$(timeout 1500 npx tauri build --no-bundle 2>&1); CODE=$?
          printf '%s\n' "$OUT" | tail -60
          MSG=$(printf '%s' "$OUT" | grep -iE 'error|failed|missing|not found|panic|denied|warning: unused' | tail -12 | tr '\n' ' ; ' | cut -c1-900)
          echo "::error::tauri build --no-bundle exit=$CODE :: $MSG"
